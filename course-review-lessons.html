our lines","Each variable you print is one you declared","All three fortunes are non-empty strings","The three fortunes are different from each other","selected matches one of the three fortunes","Code has three separate if-statements comparing the same variable to 1, 2 and 3"]}]},"conditionals-wardrobe":{"title":"2. Wardrobe — else if","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":5,"customScenes":["wardrobe","wardrobe-trace"],"workshops":[{"title":"Workshop: wind to flag","designNote":"Pilot Workshop for L2-fork. Six steps build a 4-branch if/else-if/else chain over the wind-flag domain. Surface chosen to differ from chips (wardrobe), typed-assignment (grades), and exercise (battery). Wind init value flips per step to exercise each newly-added branch via a single-shot assert. String values inside each branch are NOT pinned — checks only require `typeof flag === 'string'`, leaving the student free to label branches creatively. Canonical labels (\"calm\", etc.) appear in subsequent steps' starterCode reveals so the student sees them organically. Threshold numbers (10, 25, 50) ARE pinned because they encode the lesson's branch ordering.","steps":[{"i":"Use `let` to declare a variable called `wind` and assign it any number (knots — wind speed).","c":["Use `let` to declare a variable named `wind`.","`wind` should hold a number."],"anyValues":false},{"i":"Below `wind`, use `let` to declare `flag` with no value yet — the branches you'll add next will set it.","c":["Use `let` to declare a variable named `flag`.","Don't assign `flag` yet — the if-branches will set its value."],"anyValues":false},{"i":"Add an `if` for the calmest range — wind at most 10. Inside, set `flag` to a string (the lesson uses `\"calm\"`).","c":["Use `if` to start the branch.","Compare `wind` to `10` with `<=`.","Inside the branch, set `flag` to a string."],"anyValues":false},{"i":"After the `if`, add an `else if` for the next range — wind at most 25. Inside, set `flag` to a string (the lesson uses `\"small craft\"`).","c":["Use `else if` to add the next branch.","Compare `wind` to `25` with `<=`.","Inside the new branch, set `flag` to a string."],"anyValues":false},{"i":"Add another `else if` for the next range — wind at most 50. Inside, set `flag` to a string (the lesson uses `\"gale\"`).","c":["Compare `wind` to `50` with `<=`.","Inside the new branch, set `flag` to a string."],"anyValues":false},{"i":"Finish the chain with a final `else` for everything that didn't match above. Set `flag` to a string (the lesson uses `\"storm\"`).","c":["Add a bare `else { ... }` at the end (no `if` after `else`).","Inside the else, set `flag` to a string."],"anyValues":false}]}],"exercises":[{"title":"Lab: Battery Indicator","prompt":"Show a battery's status based on its charge level.\n\nUser stories (variable names are suggestions — pick your own if you like):\n1. Declare a number variable (e.g. level) between 0 and 100.\n2. Declare a string variable (e.g. status) and set it to \"\".\n3. If level is less than 10, set status to \"Critical\".\n4. Else if level is less than 25, set status to \"Low\".\n5. Else if level is less than 75, set status to \"Medium\".\n6. Else, set status to \"High\".\n7. Print level.\n8. Print status.\n\nUse one if / else if / else chain — the order of the checks matters.","designNote":null,"anyValues":false,"tests":["Console shows exactly two lines","Each variable you print is one you declared","Line 1 is a number between 0 and 100","Line 2 is one of \"Critical\", \"Low\", \"Medium\", \"High\"","Status matches the rule for the chosen level","Code uses one if, two else if, and a final else"]}]},"conditionals-recycling":{"title":"3. Recycling — switch","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":5,"customScenes":["recycling","recycling-trace"],"workshops":[{"title":"Workshop: HTTP status","designNote":"L3 switch workshop. Surface: HTTP status code (200/404/500) → message. Distinct from chips (animal) and exercise (button/action). Variable named `statusCode` (rather than `status`) to avoid IDE strikethrough on the deprecated DOM `status` property. The threshold numbers ARE the lesson (they encode the cases) so they stay strict; message strings are free.","steps":[{"i":"Use `let` to declare a variable called `statusCode` and assign it any number (an HTTP status code).","c":["Use `let` to declare a variable named `statusCode`.","`statusCode` should hold a number."],"anyValues":false},{"i":"Below `statusCode`, use `let` to declare `message` with no value yet — the switch's cases will set it.","c":["Use `let` to declare a variable named `message`.","Don't assign `message` yet — the cases will set its value."],"anyValues":false},{"i":"Open a `switch` on `statusCode` and add the first `case` for `200`. Inside, set `message` to a string (the lesson uses `\"OK\"`). Don't forget to end the case so it doesn't fall through.","c":["Open a `switch (statusCode) { ... }` block.","Add `case 200:` inside the switch.","End the case with `break;`.","When `statusCode` is 200, `message` should end up as a string."],"anyValues":false},{"i":"Add another `case` for `404`. Set `message` to a string (the lesson uses `\"Not Found\"`). End the case so it doesn't fall through.","c":["Add `case 404:` inside the switch.","When `statusCode` is 404, `message` should end up as a string."],"anyValues":false},{"i":"Add another `case` for `500`. Set `message` to a string (the lesson uses `\"Server Error\"`).","c":["Add `case 500:` inside the switch.","When `statusCode` is 500, `message` should end up as a string."],"anyValues":false},{"i":"Add a `default:` clause that sets `message` to a string for unknown statusCode codes (the lesson uses `\"Unknown\"`). The default runs when no case matches.","c":["Add `default:` inside the switch.","When `statusCode` is 418 (no case matches), `message` should end up as a string from the default."],"anyValues":false}]}],"exercises":[{"title":"Lab: Music Player Button","prompt":"Pick the right action when a music player button is pressed.\n\nUser stories (variable names are suggestions — pick your own if you like):\n1. Declare a string variable (e.g. button) and set it to one of: \"play\", \"pause\", \"stop\", \"next\", \"prev\".\n2. Declare a string variable (e.g. action) and set it to \"\".\n3. Use a switch on button with these cases (each ending with break):\n   - \"play\"  → action = \"Playing track\"\n   - \"pause\" → action = \"Paused\"\n   - \"stop\"  → action = \"Stopped\"\n   - \"next\"  → action = \"Skipped to next\"\n   - \"prev\"  → action = \"Back one track\"\n4. Add a default case that sets action to \"Unknown button\".\n5. Print button.\n6. Print action.\n\nDon't forget break — without it, cases fall through.","designNote":null,"anyValues":false,"tests":["Console shows exactly two lines","Each variable you print is one you declared","Line 1 is one of \"play\", \"pause\", \"stop\", \"next\", \"prev\"","Action matches the rule for the chosen button","Code uses a switch statement","Code has at least five case clauses","Code has a default case","Code uses break at least five times"]}]},"conditionals-bouncer":{"title":"4. The Bouncer — &&, || and !","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":5,"customScenes":["bouncer"],"workshops":[{"title":"Workshop: club door","designNote":"L4 boolean-operators workshop. Surface: isMember/hasGuest/isClosed → canEnter. Each step exercises one operator (||, then && + !). Boolean values are free; the expression's STRUCTURE (operator usage and grouping) is what's pinned.","steps":[{"i":"Use `let` to declare a variable called `isMember` and assign it `true` or `false`.","c":["Use `let` to declare a variable named `isMember`.","`isMember` should hold a boolean."],"anyValues":false},{"i":"Below `isMember`, declare `hasGuest` and `isClosed` as booleans (any values you like).","c":["Declare `hasGuest` with `let`.","Declare `isClosed` with `let`.","Both `hasGuest` and `isClosed` should be booleans."],"anyValues":false},{"i":"Use `let` to declare `canEnter` and set it based on whether the person is a member OR has a guest pass. The result should be true if either is true.","c":["Use `let` to declare a variable named `canEnter`.","Use the `||` operator on `isMember` and `hasGuest`.","When isMember is false but hasGuest is true, `canEnter` should be true."],"anyValues":false},{"i":"Update `canEnter` so it's also blocked when the club is closed. Remember you can use `( )` to group conditions together.","c":["Use parentheses around `isMember || hasGuest`.","Combine the group with `&&`.","Apply `!` (not) to `isClosed`.","When the club is closed, `canEnter` should be false even for a member."],"anyValues":false}]}],"exercises":[{"title":"Lab: Smart Light","prompt":"A smart light should turn on only at night when it senses motion — unless someone has switched it off manually.\n\nUser stories (variable names are suggestions — pick your own if you like):\n1. Declare a number variable (e.g. hour) between 0 and 23.\n2. Declare a boolean variable (e.g. motion) — true if motion is sensed.\n3. Declare a boolean variable (e.g. manualOff) — true if the manual switch is off.\n4. Declare a boolean variable (e.g. lightOn) and set it to false.\n5. Set lightOn to true when ALL of these hold:\n   - motion is true\n   - it's night: hour < 7 OR hour >= 19\n   - manualOff is NOT true\n   Use && , || and ! together. Wrap the night check in parentheses.\n6. Print hour, motion, manualOff and lightOn (four lines, in that order).","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Each variable you print is one you declared","Line 1 is a number between 0 and 23","Lines 2-4 are \"true\" or \"false\"","lightOn matches the rule given hour, motion and manualOff","Code uses && , || and ! together","Code uses parentheses to group the night check"]}]},"loops-stairs":{"title":"1. Stairs — for","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":6,"customScenes":["stairs","stairs-trace"],"workshops":[{"title":"Workshop: row of stars","designNote":"L5 for-loop workshop. Surface: count → stars (a string accumulator). Distinct from chips (n) and exercise (factor/i). The student writes the canonical `for (let i = 0; i < count; i++)` header and accumulates inside. The literal symbol `\"*\"` is free (any single-char string accepted via typeof string).","steps":[{"i":"Use `let` to declare a variable called `count` and assign it any positive whole number — how many stars you want.","c":["Use `let` to declare a variable named `count`.","`count` should hold a number."],"anyValues":false},{"i":"Below `count`, use `let` to declare `stars` and assign it the empty string `\"\"` — the loop will append to it.","c":["Use `let` to declare a variable named `stars`.","`stars` should start as the empty string `\"\"`."],"anyValues":false},{"i":"Write a for-loop header so the body will run `count` times. Remember a for-loop's header has three parts — an initialization, a condition, and an update. Leave the body empty for now.","c":["Use `for` to start the loop.","Initialize `let i = 0` in the loop header.","Set the condition `i < count`.","Update `i` with `i++` in the loop header."],"anyValues":false},{"i":"Inside the loop body, append one `\"*\"` to `stars` each time the loop runs. After the loop, `stars` should be one star longer for every round.","c":["Use `+=` to append onto `stars`.","After the loop, `stars` should be a string with as many characters as `count`."],"anyValues":false}]}],"exercises":[{"title":"Lab: Multiplication Table","prompt":"Print the first ten multiples of a number you pick.\n\nUser stories (variable names are suggestions):\n1. Declare a number variable (e.g. factor) between 2 and 12.\n2. Use a for loop with an index from 1 to 10 (inclusive).\n3. Inside the loop, console.log factor multiplied by the current index.\n4. There should be exactly ten lines of output, and each line is the product.","designNote":null,"anyValues":false,"tests":["Console shows exactly ten lines","Every line is a finite number","Lines form a multiplication table (each line = factor × position)","Code uses a for loop"]}]},"loops-letters":{"title":"2. Letters — for…of","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":5,"customScenes":["letters","letters-trace"],"workshops":[{"title":"Workshop: count chars","designNote":"L6 for…of workshop. Surface: text → len (count by iteration). Distinct from chips (word/count vowels) and exercise (word/letter/found bool). The student demonstrates that for…of yields each char so that incrementing once per iteration gives string length.","steps":[{"i":"Use `let` to declare a variable called `text` and assign it any string.","c":["Use `let` to declare a variable named `text`.","`text` should hold a string."],"anyValues":false},{"i":"Below `text`, use `let` to declare `len` and start it at 0 — the loop will increment it.","c":["Use `let` to declare a variable named `len`.","`len` should start at 0."],"anyValues":false},{"i":"Write a `for…of` header that walks each character of `text`. Name the loop variable `ch`. Leave the body empty for now.","c":["Use `for ( ... of ... )` to iterate.","Name the loop variable `ch`."],"anyValues":false},{"i":"Inside the loop, increment `len` by 1 each round. After the loop, `len` should equal the number of characters in `text`.","c":["Increment `len` (e.g. `len++` or `len += 1`).","After the loop, `len` should equal the length of `text`."],"anyValues":false}]}],"exercises":[{"title":"Lab: Letter Search","prompt":"Check whether a word contains a chosen letter.\n\nUser stories (variable names are suggestions):\n1. Declare a string (e.g. word) with at least 5 characters.\n2. Declare a string (e.g. letter) with exactly one character.\n3. Declare a boolean (e.g. found) and set it to false.\n4. Use a for…of loop to walk through word.\n5. Inside the loop, if the current character === letter, set found to true.\n6. Print word, letter, and found (three lines, in that order).","designNote":null,"anyValues":false,"tests":["Console shows exactly three lines","Each variable you print is one you declared","Line 1 is a string with at least 5 characters","Line 2 is exactly one character","Line 3 is \"true\" or \"false\"","found correctly reports whether word contains letter","Code uses for…of"]}]},"loops-countdown":{"title":"3. Countdown — while","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":5,"customScenes":["countdown","countdown-trace"],"workshops":[{"title":"Workshop: halving balance","designNote":"L7 while-loop workshop. Surface: balance → halvings (count operations until balance < 1). Distinct from chips (limit) and exercise (goal/weekly/saved/weeks). The student writes a while header that reads from a state and a body that mutates that state — the heart of the while pattern.","steps":[{"i":"Use `let` to declare `balance` and assign it any positive number greater than 1.","c":["Use `let` to declare a variable named `balance`.","`balance` should hold a number greater than 1."],"anyValues":false},{"i":"Below `balance`, use `let` to declare `halvings` and start it at 0 — the loop will count up.","c":["Use `let` to declare a variable named `halvings`.","`halvings` should start at 0."],"anyValues":false},{"i":"Write a `while` loop that keeps running as long as `balance` is still 1 or more. Leave the body empty for now.","c":["Use `while` to start the loop.","Compare `balance` to `1` with `>=`."],"anyValues":false},{"i":"Inside the loop, halve `balance` and increment `halvings` by 1. After the loop, `balance` should be less than 1 — and `halvings` should record how many rounds it took to get there.","c":["Halve `balance` (e.g. `balance = balance / 2` or `balance /= 2`).","Increment `halvings` (e.g. `halvings++`).","After the loop, `balance` should be less than 1 and `halvings` should be a positive number."],"anyValues":false}]}],"exercises":[{"title":"Lab: Save Up Money","prompt":"Count how many weeks of fixed savings are needed to reach a goal.\n\nUser stories (variable names are suggestions):\n1. Declare a number variable (e.g. goal) — the amount you want to save (e.g. 1000).\n2. Declare a number variable (e.g. weekly) — how much you save each week (e.g. 75).\n3. Declare a number variable (e.g. saved) and set it to 0.\n4. Declare a number variable (e.g. weeks) and set it to 0.\n5. Use a while loop that runs while saved < goal:\n   - add weekly to saved\n   - increment weeks by 1\n6. Print weeks.\n7. Print saved (the final amount, after the loop ends).","designNote":null,"anyValues":false,"tests":["Console shows exactly two lines","Each variable you print is one you declared","Line 1 (weeks) is a positive whole number","Line 2 (saved) is a positive number","saved equals weekly × weeks (the loop accumulated correctly)","Code uses a while loop"]}]},"loops-tasting":{"title":"4. Tasting — do…while","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":4,"customScenes":["tasting","tasting-trace"],"workshops":[{"title":"Workshop: keep doubling","designNote":"L8 do…while workshop. Surface: value/steps (keep doubling). Distinct from chips (n/limit) and exercise (target/pourSize/cup/pours). The starterCode for the final step uses an initial value already > 1000 to highlight do…while's at-least-once property — but the assert tolerates either case.","steps":[{"i":"Use `let` to declare `value` and assign it any positive number.","c":["Use `let` to declare a variable named `value`.","`value` should hold a positive number."],"anyValues":false},{"i":"Below `value`, use `let` to declare `steps` and start it at 0 — the loop counts doublings.","c":["Use `let` to declare a variable named `steps`.","`steps` should start at 0."],"anyValues":false},{"i":"Write the `do…while` skeleton. The loop should keep running while `value` is still 1000 or below. Leave the body empty for now — note that a `do…while` ends with a semicolon after the while-condition.","c":["Open with `do {`.","Close with `} while (value <= 1000);`."],"anyValues":false},{"i":"Inside the do block, double `value` and count the doubling in `steps`. Note: the starterCode already has `value` over 1000 — try Check, then look at `steps`. The body runs at least once even when the condition is already false.","c":["Double `value` (e.g. `value = value * 2` or `value *= 2`).","Increment `steps` (e.g. `steps++`).","Even when `value` started above 1000, `steps` should be at least 1 — the do block runs once."],"anyValues":false}]}],"exercises":[{"title":"Lab: Refill a Cup","prompt":"Pour a fixed amount of water into a cup until it's full enough; count the pours.\n\nUser stories (variable names are suggestions):\n1. Declare a number variable (e.g. target) — the desired amount in ml (e.g. 250).\n2. Declare a number variable (e.g. pourSize) — how much each pour adds (e.g. 60).\n3. Declare a number variable (e.g. cup) and set it to 0.\n4. Declare a number variable (e.g. pours) and set it to 0.\n5. Use a do…while loop: each iteration adds pourSize to cup and increments pours by 1.\n   The loop continues while cup < target.\n6. Print pours.\n7. Print cup (the final volume).\n\ndo…while runs the body once before checking the condition — useful when at least one pour must happen.","designNote":null,"anyValues":false,"tests":["Console shows exactly two lines","Each variable you print is one you declared","Line 1 (pours) is a positive whole number","Line 2 (cup) equals pours × pourSize","Code uses do…while"]}]},"box-model":{"title":"The Box Model","slideTypes":["explanation","assignment"],"explanationCount":5,"customScenes":[],"workshops":[],"exercises":[{"title":"Practice: set a size","prompt":"Make .box 250px wide and 120px tall.","designNote":null,"anyValues":false,"tests":["width: 250px","height: 120px"]},{"title":"Practice: percentages","prompt":"Make .box 50% wide (half the parent). Height can be 80px.","designNote":null,"anyValues":false,"tests":["height: 80px"]},{"title":"Practice: a bit of air","prompt":"Give .box 20px padding on all sides.","designNote":null,"anyValues":false,"tests":["padding-top: 20px","padding-right: 20px","padding-bottom: 20px","padding-left: 20px"]},{"title":"Practice: different sides","prompt":"Give .box 10px padding top/bottom and 30px left/right.","designNote":null,"anyValues":false,"tests":["padding-top: 10px","padding-bottom: 10px","padding-left: 30px","padding-right: 30px"]},{"title":"Practice: a regular border","prompt":"Give .box a 3px solid blue border.","designNote":null,"anyValues":false,"tests":["border-top-width: 3px","border-top-style: solid","border-top-color: rgb(0, 0, 255)"]},{"title":"Practice: only one side","prompt":"Give .box only a BOTTOM border: 2px dashed gray.","designNote":null,"anyValues":false,"tests":["border-bottom-width: 2px","border-bottom-style: dashed","border-bottom-color: rgb(128, 128, 128)","border-top-width: 0px"]},{"title":"Practice: spacing","prompt":"Give .box margin-top 30px and margin-bottom 10px.","designNote":null,"anyValues":false,"tests":["margin-top: 30px","margin-bottom: 10px"]},{"title":"Practice: center","prompt":"Center .box horizontally with margin auto. Also give it a width of 200px.","designNote":null,"anyValues":false,"tests":["width: 200px","margin-left: auto","margin-right: auto"]},{"title":"Final: match the goal","prompt":"The lower preview shows the goal. Style .card so your version is as close as possible. No legend this time — you've seen everything you need!","designNote":null,"anyValues":false,"tests":["width: 280px (tolerance: 15)","padding-top: 20px","padding-right: 20px","padding-bottom: 20px","padding-left: 20px","border-top-width: 3px","border-top-style: solid","border-top-color: rgb(139, 0, 0)","margin-top: 24px (tolerance: 10)"]}]}};
</script>
<script>

const $ = id => document.getElementById(id);
const pi = s => (window.marked && marked.parseInline) ? marked.parseInline(s) : s;

const noteKey = id => 'fr:' + id;
const getNote = id => localStorage.getItem(noteKey(id)) || '';
const saveNote = (id, txt) => localStorage.setItem(noteKey(id), txt);
const delNote = id => localStorage.removeItem(noteKey(id));

function hasAnyNote(itemId) {
  const prefix = 'fr:' + itemId;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k === prefix) {
      if (localStorage.getItem(k)) return true;
    } else if (k.indexOf(prefix + ':') === 0) {
      if (localStorage.getItem(k)) return true;
    }
  }
  return false;
}

function allIds() {
  const ids = new Set();
  function walk(items) {
    for (const it of items) {
      if (it.type === 'topic') walk(it.items);
      else ids.add(it.id);
    }
  }
  for (const g of NAV) walk(g.items);
  return ids;
}

function noteCountForThisFile() {
  const ids = allIds();
  let n = 0;
  ids.forEach(id => { if (hasAnyNote(id)) n++; });
  return n;
}

const TAB_KEY = 'cul:reviewtab';
const getSavedTab = () => localStorage.getItem(TAB_KEY) || 'workshops';
const setSavedTab = (t) => localStorage.setItem(TAB_KEY, t);

let current = null;

function buildNav() {
  const root = $('nav-root');
  root.innerHTML = NAV.map(buildGroup).join('');
  root.addEventListener('click', onNavClick);
}

function buildGroup(g) {
  const body = g.items.map(it => it.type === 'topic' ? buildTopic(it) : buildItem(it)).join('');
  return '<div class="ng" data-gid="' + g.id + '"><button class="ng-btn"><span class="arr">\u25BE</span>' + g.label + '</button><div class="ng-body">' + body + '</div></div>';
}

function buildTopic(t) {
  const body = t.items.map(buildItem).join('');
  return '<div class="nt" data-tid="' + t.id + '"><div class="nt-lbl"><span class="arr">\u25BE</span>' + t.label + '</div><div class="nt-body">' + body + '</div></div>';
}

function buildItem(it) {
  const vbadge = it.variant === 'walkthrough' ? '<span class="vbadge vbadge-w">W</span>'
               : it.variant === 'challenge'   ? '<span class="vbadge vbadge-c">C</span>'
               : '';
  const hasNote = getNote(it.id) ? 'has-note' : '';
  return '<div class="ni ' + hasNote + '" data-iid="' + it.id + '">' + vbadge + it.title + '<span class="fdot"></span></div>';
}

function onNavClick(e) {
  const gb = e.target.closest('.ng-btn');
  if (gb) { gb.closest('.ng').classList.toggle('closed'); return; }
  const tl = e.target.closest('.nt-lbl');
  if (tl) { tl.closest('.nt').classList.toggle('closed'); return; }
  const item = e.target.closest('.ni');
  if (item) loadById(item.dataset.iid);
}

function setActive(id) {
  document.querySelectorAll('.ni').forEach(el => el.classList.toggle('active', el.dataset.iid === id));
}

function refreshDots() {
  document.querySelectorAll('.ni').forEach(el => {
    el.classList.toggle('has-note', hasAnyNote(el.dataset.iid));
  });
  $('note-count').textContent = noteCountForThisFile();
}

function findItem(id) {
  for (const g of NAV) {
    for (const it of g.items) {
      if (it.type === 'topic') {
        for (const li of it.items) if (li.id === id) return li;
      } else if (it.id === id) return it;
    }
  }
  return null;
}

function loadById(id) {
  const item = findItem(id);
  if (!item) return;
  current = id;
  setActive(id);
  const ci = $('ci');
  ci.innerHTML = item.type === 'doc' ? renderDoc(item) : renderLesson(item);
  ci.classList.remove('fadein');
  void ci.offsetWidth;
  ci.classList.add('fadein');
  $('content').scrollTop = 0;
  if (item.type === 'doc') {
    attachFeedback(id);
  } else {
    initLessonTabs(item.id);
    attachCardFeedback();
  }
}

function renderDoc(item) {
  const raw = ($(item.src) && $(item.src).textContent) || '';
  const html = marked.parse(raw);
  return '<div class="c-hdr"><div class="c-ey">Documentation</div><div class="c-title">' + item.title + '</div></div><div class="md">' + html + '</div>' + feedbackSection(item.id);
}

function renderLesson(item) {
  const d = LD[item.file];
  if (!d) return '<p>Data not found for ' + item.file + '.</p>';

  let topicLabel = 'JavaScript';
  for (const g of NAV) {
    for (const it of g.items) {
      if (it.type === 'topic') {
        for (const li of it.items) {
          if (li.id === item.id) { topicLabel = g.label + ' · ' + it.label; break; }
        }
      }
    }
  }

  const bMap = {
    'explanation':'b-expl','js-workshop':'b-wksh','exercise':'b-exer',
    'js-chip-assignment':'b-chip','js-typed-assignment':'b-type',
    'assignment':'b-assign','js-assignment':'b-assign'
  };
  const bLabel = {
    'explanation':'Explanation \u00D7' + d.explanationCount,
    'js-workshop':'Workshop \u00D7' + d.workshops.length,
    'exercise':'Exercise \u00D7' + d.exercises.length,
    'js-chip-assignment':'Chip puzzle',
    'js-typed-assignment':'Typed assignment',
    'assignment':'Assignment \u00D7' + d.exercises.length,
    'js-assignment':'JS Assignment'
  };

  const badges = d.slideTypes.map(t => '<span class="badge ' + (bMap[t] || 'b-expl') + '">' + (bLabel[t] || t) + '</span>').join('');

  const scenes = d.customScenes && d.customScenes.length
    ? '<div class="scenes">' + d.customScenes.map(s => '<span class="scene-tag">' + s + '</span>').join('') + '</div>'
    : '';

  const exLabel = d.slideTypes.indexOf('assignment') !== -1 ? 'Assignments' : 'Exercises';

  const tabs = '<div class="tabs" id="lesson-tabs">'
    + '<button class="tab" data-tab="workshops">Workshops <span class="count">' + d.workshops.length + '</span></button>'
    + '<button class="tab" data-tab="exercises">' + exLabel + ' <span class="count">' + d.exercises.length + '</span></button>'
    + '</div>';

  const wkPanel = d.workshops.length
    ? '<div class="cards-grid">' + d.workshops.map((w, i) => renderWorkshop(w, item.id, i)).join('') + '</div>'
    : '<div class="empty-tab">No workshops in this lesson.</div>';

  const exPanel = d.exercises.length
    ? '<div class="cards-grid">' + d.exercises.map((e, i) => renderExercise(e, item.id, i)).join('') + '</div>'
    : '<div class="empty-tab">No ' + exLabel.toLowerCase() + ' in this lesson.</div>';

  const panels = '<div class="tab-panel" data-panel="workshops">' + wkPanel + '</div>'
    + '<div class="tab-panel" data-panel="exercises">' + exPanel + '</div>';

  return '<div class="c-hdr"><div class="c-ey">' + topicLabel + '</div><div class="c-title">' + d.title + '</div><div class="badges">' + badges + '</div></div>' + scenes + tabs + panels;
}

function renderDesignNote(text) {
  return text ? '<div class="design-note dn-inline">' + text + '</div>' : '';
}

function valuesPill(anyValues) {
  return anyValues
    ? '<span class="values-pill any">ANY VALUES</span>'
    : '<span class="values-pill exact">EXACT VALUES</span>';
}

function renderWorkshop(w, lessonId, idx) {
  const cardId = lessonId + ':wk:' + idx;
  const steps = w.steps.map((s, i) =>
    '<div class="step-blk">'
    + '<div class="step-num-row"><div class="step-num">Step ' + (i + 1) + '</div>' + valuesPill(s.anyValues) + '</div>'
    + '<div class="step-instr">' + pi(s.i) + '</div>'
    + '<ul class="checks">' + s.c.map(c => '<li class="chk">' + pi(c) + '</li>').join('') + '</ul>'
    + '</div>'
  ).join('');
  return '<div class="wk-block">'
    + '<div class="wk-title">' + w.title + '</div>'
    + (w.designNote ? '<div class="dn-wrap">' + renderDesignNote(w.designNote) + '</div>' : '')
    + steps
    + cardFeedback(cardId, 'workshop')
    + '</div>';
}

function renderExercise(e, lessonId, idx) {
  const cardId = lessonId + ':ex:' + idx;
  const tests = e.tests.map(t => '<li class="test-lbl">' + pi(t) + '</li>').join('');
  return '<div class="ex-block">'
    + '<div class="ex-title">' + e.title + valuesPill(e.anyValues) + '</div>'
    + (e.designNote ? '<div class="dn-wrap">' + renderDesignNote(e.designNote) + '</div>' : '')
    + '<div class="ex-body"><div class="ex-prompt">' + pi(e.prompt) + '</div><ul class="tests">' + tests + '</ul></div>'
    + cardFeedback(cardId, 'exercise')
    + '</div>';
}

function cardFeedback(cardId, kind) {
  const saved = getNote(cardId);
  const placeholder = 'Notes for this ' + kind + '\u2026';
  return '<div class="card-fb">'
    + '<textarea class="card-fb-ta" data-card-id="' + cardId + '" placeholder="' + placeholder + '">' + saved.replace(/</g, '&lt;') + '</textarea>'
    + '<div class="card-fb-bar">'
    +   '<button class="card-fb-clr" data-clear-id="' + cardId + '" title="Clear this note" aria-label="Clear this note">\u00D7</button>'
    +   '<span class="card-fb-st' + (saved ? ' ok' : '') + '" data-status-for="' + cardId + '">' + (saved ? 'Saved' : '') + '</span>'
    + '</div>'
    + '</div>';
}

function initLessonTabs(lessonId) {
  const tabsRoot = $('lesson-tabs');
  if (!tabsRoot) return;

  const wkCount = document.querySelectorAll('[data-panel="workshops"] .wk-block').length;
  const exCount = document.querySelectorAll('[data-panel="exercises"] .ex-block').length;

  let initial = getSavedTab();
  if (initial === 'workshops' && wkCount === 0 && exCount > 0) initial = 'exercises';
  if (initial === 'exercises' && exCount === 0 && wkCount > 0) initial = 'workshops';

  activateTab(initial);

  tabsRoot.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activateTab(btn.dataset.tab);
    setSavedTab(btn.dataset.tab);
  });
}

function activateTab(name) {
  document.querySelectorAll('#lesson-tabs .tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.panel === name);
  });
}

function attachCardFeedback() {
  document.querySelectorAll('.card-fb-ta').forEach(ta => {
    let timer = null;
    ta.addEventListener('input', () => {
      const cardId = ta.dataset.cardId;
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      if (st) { st.textContent = 'Typing\u2026'; st.className = 'card-fb-st'; }
      clearTimeout(timer);
      timer = setTimeout(() => {
        const val = ta.value.trim();
        if (val) saveNote(cardId, val);
        else delNote(cardId);
        if (st) { st.textContent = '\u2713 Saved'; st.className = 'card-fb-st ok'; }
        refreshDots();
      }, 600);
    });
    ta.addEventListener('blur', () => {
      if (!timer) return;
      clearTimeout(timer);
      timer = null;
      const cardId = ta.dataset.cardId;
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      const val = ta.value.trim();
      if (val) saveNote(cardId, val);
      else delNote(cardId);
      if (st) { st.textContent = '\u2713 Saved'; st.className = 'card-fb-st ok'; }
      refreshDots();
    });
  });

  document.querySelectorAll('.card-fb-clr').forEach(btn => {
    btn.addEventListener('click', () => {
      const cardId = btn.dataset.clearId;
      const ta = document.querySelector('.card-fb-ta[data-card-id="' + cardId + '"]');
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      if (ta) ta.value = '';
      delNote(cardId);
      if (st) {
        st.textContent = 'Cleared';
        st.className = 'card-fb-st';
        setTimeout(() => { if (st.textContent === 'Cleared') st.textContent = ''; }, 1500);
      }
      refreshDots();
    });
  });
}

function clearAllNotes() {
  const count = noteCountForThisFile();
  if (count === 0) { alert('No notes to clear.'); return; }
  const msg = 'Clear ALL notes (' + count + ' item' + (count === 1 ? '' : 's') + ')?\n\nThis cannot be undone.';
  if (!confirm(msg)) return;

  const toDelete = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf('fr:') === 0) toDelete.push(k);
  }
  toDelete.forEach(k => localStorage.removeItem(k));

  document.querySelectorAll('.card-fb-ta').forEach(ta => { ta.value = ''; });
  document.querySelectorAll('.fb-ta').forEach(ta => { ta.value = ''; });
  document.querySelectorAll('.card-fb-st').forEach(s => { s.textContent = ''; s.className = 'card-fb-st'; });
  document.querySelectorAll('.save-st').forEach(s => { s.textContent = ''; s.className = 'save-st'; });
  refreshDots();
}

function feedbackSection(id) {
  const saved = getNote(id);
  return '<div class="fb-section"><div class="fb-label">Notes</div><textarea class="fb-ta" id="fb-ta" placeholder="Add your feedback, concerns, ideas, or TODOs for this item\u2026">' + saved.replace(/</g, '&lt;') + '</textarea><div class="fb-footer"><button class="btn-save" onclick="doSave()">Save Note</button><button class="btn-clr" onclick="doClear()">Clear</button><span class="save-st" id="save-st">' + (saved ? 'Saved' : '') + '</span></div></div>';
}

function attachFeedback(id) {
  const ta = $('fb-ta');
  if (!ta) return;
  ta.addEventListener('input', () => {
    const st = $('save-st');
    if (st) { st.textContent = 'Unsaved changes'; st.className = 'save-st'; }
  });
}

function doSave() {
  const ta = $('fb-ta'); if (!ta) return;
  saveNote(current, ta.value.trim());
  const st = $('save-st');
  if (st) { st.textContent = '\u2713 Saved'; st.className = 'save-st ok'; }
  refreshDots();
}

function doClear() {
  const ta = $('fb-ta'); if (!ta) return;
  if (ta.value && !confirm('Clear this note?')) return;
  ta.value = '';
  delNote(current);
  const st = $('save-st');
  if (st) { st.textContent = 'Cleared'; st.className = 'save-st'; }
  refreshDots();
}

function exportNotes() {
  const lines = [];
  const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ');
  lines.push('# Course Review Notes  (exported ' + stamp + ')');
  lines.push('');

  let anyNote = false;

  function walkLessonItem(item, crumb) {
    const data = LD[item.file];
    if (!data) return;

    const sections = [];

    const legacy = getNote(item.id);
    if (legacy) sections.push({ heading: 'General', body: legacy });

    data.workshops.forEach((w, i) => {
      const n = getNote(item.id + ':wk:' + i);
      if (n) sections.push({ heading: 'Workshop — ' + w.title, body: n });
    });

    data.exercises.forEach((e, i) => {
      const n = getNote(item.id + ':ex:' + i);
      if (n) sections.push({ heading: 'Exercise — ' + e.title, body: n });
    });

    if (sections.length === 0) return;
    anyNote = true;

    lines.push('## ' + crumb + ' · ' + data.title);
    lines.push('_id: ' + item.id + '_');
    lines.push('');
    for (const sec of sections) {
      lines.push('### ' + sec.heading);
      lines.push(sec.body);
      lines.push('');
    }
  }

  function walkDocItem(item, crumb) {
    const n = getNote(item.id);
    if (!n) return;
    anyNote = true;
    lines.push('## ' + crumb + ' · ' + (item.title || item.file));
    lines.push('_id: ' + item.id + '_');
    lines.push('');
    lines.push(n);
    lines.push('');
  }

  for (const group of NAV) {
    for (const it of group.items) {
      if (it.type === 'topic') {
        for (const li of it.items) {
          const crumb = group.label + ' · ' + it.label;
          if (li.type === 'doc') walkDocItem(li, crumb);
          else walkLessonItem(li, crumb);
        }
      } else if (it.type === 'doc') {
        walkDocItem(it, group.label);
      } else {
        walkLessonItem(it, group.label);
      }
    }
  }

  if (!anyNote) {
    lines.push('_(No notes saved yet.)_');
  }

  const text = lines.join('\n');
  const btn = $('export-btn');

  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };

  const flash = (ok) => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = ok ? '\u2713 Copied' : 'Copy failed';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 1400);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash(true), () => { fallback(); flash(true); });
  } else {
    fallback();
    flash(true);
  }
}
