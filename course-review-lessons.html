<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#13120f;--bg-sidebar:#0f0e0c;--bg-card:#1c1b17;--bg-card-alt:#201f1a;
  --border:#2e2b25;--border-mid:#3d3a33;
  --text:#e8e2d4;--text-muted:#a09890;--text-dim:#5c564e;
  --amber:#d4913a;--amber-soft:#e8b460;--amber-bg:#2a2010;--amber-border:#4a3820;
  --blue:#5b8db5;--blue-bg:#0e1f2e;--blue-border:#1a3a5c;
  --rust:#c47b50;--rust-bg:#2a1508;--rust-border:#4a2510;
  --green:#6ea86e;--green-bg:#102010;--check:#5ea870;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

#hdr{height:48px;background:var(--bg-sidebar);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;z-index:10}
#hdr-logo{width:260px;flex-shrink:0;padding:0 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:2px}
#hdr-logo .ey{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:500}
#hdr-logo .ti{font-family:'Libre Baskerville',serif;font-size:14px;color:var(--text)}
#hdr-tabs{display:flex;align-items:center;gap:4px;padding:0 18px;border-right:1px solid var(--border)}
#hdr-tabs a{font-size:12px;color:var(--text-muted);text-decoration:none;padding:5px 12px;border-radius:4px;transition:all .12s;border:1px solid transparent}
#hdr-tabs a:hover{color:var(--text);background:rgba(255,255,255,.03)}
#hdr-tabs a.cur{color:var(--amber-soft);background:var(--amber-bg);border-color:var(--amber-border)}
#hdr-meta{display:flex;align-items:center;padding:0 20px;margin-left:auto;font-size:12px;color:var(--text-muted);gap:10px}
#hdr-meta b{color:var(--amber-soft);font-weight:600}
.export-btn{background:none;border:1px solid var(--border-mid);color:var(--text-muted);padding:5px 11px;border-radius:4px;font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;font-weight:500}
.export-btn:hover{color:var(--amber-soft);border-color:var(--amber-border);background:var(--amber-bg)}
.export-btn.copied{color:#1a0e00;background:var(--amber);border-color:var(--amber)}
.clear-all-btn:hover{color:#e89090;border-color:#6a2828;background:rgba(122,40,40,.18)}

#app{display:flex;flex:1;overflow:hidden}
#sidebar{width:260px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding-bottom:40px}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:2px}

.ng{margin-top:4px}
.ng-btn{width:100%;background:none;border:none;cursor:pointer;padding:9px 14px 6px;display:flex;align-items:center;gap:7px;color:var(--text-muted);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Sans',sans-serif;transition:color .15s}
.ng-btn:hover{color:var(--text)}
.ng-btn .arr{font-size:7px;transition:transform .2s;display:inline-block;margin-right:1px}
.ng.closed .arr{transform:rotate(-90deg)}
.ng.closed .ng-body{display:none}

.nt{margin-top:1px}
.nt-lbl{padding:4px 14px 3px 22px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
.nt-lbl .arr{font-size:7px;transition:transform .15s;color:var(--text-dim)}
.nt.closed .arr{transform:rotate(-90deg)}
.nt.closed .nt-body{display:none}

.ni{display:flex;align-items:center;padding:5px 12px 5px 28px;cursor:pointer;font-size:12.5px;color:var(--text-muted);border-left:2px solid transparent;transition:all .12s;gap:5px;line-height:1.3}
.ni:hover{color:var(--text);background:rgba(255,255,255,.03)}
.ni.active{color:var(--amber-soft);border-left-color:var(--amber);background:var(--amber-bg)}
.ni .fdot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-left:auto;display:none}
.ni.has-note .fdot{display:block}
.ni .vbadge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500;flex-shrink:0}
.vbadge-w{background:var(--green-bg);color:var(--green)}
.vbadge-c{background:var(--rust-bg);color:var(--rust)}

#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:40px 56px;scroll-behavior:smooth}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-track{background:transparent}
#content::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:3px}
#ci{max-width:860px;margin:0 auto}
body.lessons #content{padding:40px 36px}
body.lessons #ci{max-width:none;margin:0}

#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dim)}
#empty .big{font-family:'Libre Baskerville',serif;font-size:20px;color:var(--text-muted)}
#empty .sm{font-size:13px}

.c-ey{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
.c-title{font-family:'Libre Baskerville',serif;font-size:26px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:14px}
.c-hdr{margin-bottom:28px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:10px;font-weight:500;padding:3px 9px;border-radius:4px;letter-spacing:.04em}
.b-expl{background:#1e1e1e;color:var(--text-muted);border:1px solid var(--border-mid)}
.b-wksh{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-exer{background:var(--rust-bg);color:var(--rust);border:1px solid var(--rust-border)}
.b-chip{background:#1a1a2e;color:#8080d4;border:1px solid #2a2a4a}
.b-type{background:#2e1a2e;color:#c878c8;border:1px solid #4a2a4a}
.b-scene{background:#0e1e20;color:#6ebaba;border:1px solid #1a3a3e}
.b-assign{background:#1e1a10;color:#a89060;border:1px solid #3a3020}

.design-note{background:var(--amber-bg);border:1px solid var(--amber-border);border-left:3px solid var(--amber);padding:11px 15px;border-radius:0 6px 6px 0;font-size:12.5px;color:#c8a870;line-height:1.6;margin-bottom:24px;font-style:italic}
.design-note::before{content:"Design note";display:block;font-style:normal;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
.dn-wrap{padding:13px 15px;border-bottom:1px solid var(--border)}
.dn-wrap .design-note{margin-bottom:0}

/* ─── Tabs ────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{background:none;border:none;font-family:'DM Sans',sans-serif;color:var(--text-muted);font-size:12px;font-weight:500;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:color .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber-soft);border-bottom-color:var(--amber)}
.tab .count{font-size:10px;background:#1e1e1e;padding:1px 7px;border-radius:8px;color:var(--text-muted);border:1px solid var(--border-mid);font-weight:500;line-height:1.4}
.tab.active .count{background:var(--amber-bg);color:var(--amber-soft);border-color:var(--amber-border)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.empty-tab{padding:48px 20px;text-align:center;color:var(--text-dim);font-style:italic;font-size:13px;border:1px dashed var(--border);border-radius:8px}

/* ─── Cards grid ─────────────────────────────────────────── */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cards-grid{grid-template-columns:1fr}}

/* ─── Per-card feedback ──────────────────────────────────── */
.card-fb{padding:11px 15px 13px;background:rgba(212,145,58,.04);border-top:1px solid var(--border)}
.card-fb-ta{width:100%;min-height:54px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:5px;padding:8px 11px;font-family:'Libre Baskerville',serif;font-size:12px;color:var(--text);resize:vertical;outline:none;line-height:1.6;transition:border-color .15s}
.card-fb-ta::placeholder{color:var(--text-dim);font-style:italic}
.card-fb-ta:focus{border-color:var(--amber)}
.card-fb-bar{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:22px}
.card-fb-clr{background:none;border:1px solid var(--border-mid);color:var(--text-dim);width:22px;height:22px;border-radius:4px;font-size:14px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:'DM Sans',sans-serif}
.card-fb-clr:hover{color:#e89090;border-color:#6a2828;background:rgba(122,40,40,.18)}
.card-fb-st{font-size:10px;color:var(--text-dim);transition:all .25s;margin-left:auto;min-height:13px}
.card-fb-st.ok{color:var(--check)}

.scenes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.scene-tag{font-size:11px;background:#0e1e20;color:#6ebaba;border:1px solid #1a3a3e;padding:3px 10px;border-radius:4px;font-family:'Fira Code',monospace}

.sec-hd{font-family:'Libre Baskerville',serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:16px;margin-top:36px}

.wk-block{margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wk-title{background:var(--blue-bg);border-bottom:1px solid var(--blue-border);padding:9px 15px;font-size:13px;font-weight:500;color:var(--blue);display:flex;align-items:center;gap:8px}
.wk-title::before{content:"WORKSHOP";font-size:8px;letter-spacing:.12em;background:rgba(91,141,181,.18);padding:2px 7px;border-radius:3px}
.step-blk{padding:13px 15px;border-bottom:1px solid var(--border)}
.step-blk:last-child{border-bottom:none}
.step-num{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px}
.step-instr{font-size:13px;color:var(--text);line-height:1.65;margin-bottom:9px}
.step-instr code,.check-msg code,.test-lbl code,.chk code{font-family:'Fira Code',monospace;font-size:11.5px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;color:#d0c8b0}
.checks{list-style:none;display:flex;flex-direction:column;gap:4px}
.chk{font-size:12px;color:var(--text-muted);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.chk::before{content:"\2713";color:var(--check);font-size:11px;flex-shrink:0;margin-top:1px}

.ex-block{margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ex-title{background:var(--rust-bg);border-bottom:1px solid var(--rust-border);padding:9px 15px;font-size:13px;font-weight:500;color:var(--rust);display:flex;align-items:center;gap:8px}
.ex-title::before{content:"EXERCISE";font-size:8px;letter-spacing:.12em;background:rgba(196,123,80,.15);padding:2px 7px;border-radius:3px}
.values-pill{font-size:8px;letter-spacing:.12em;padding:2px 7px;border-radius:3px;font-weight:600}
.values-pill.exact{background:var(--amber-bg);color:var(--amber-soft);border:1px solid var(--amber-border)}
.values-pill.any{background:rgba(74,154,138,.15);color:var(--teal);border:1px solid rgba(74,154,138,.35)}
.ex-title .values-pill{margin-left:auto}
.step-num-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.step-num-row .step-num{margin-bottom:0}
.ex-body{padding:13px 15px}
.ex-prompt{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:11px;font-style:italic}
.tests{list-style:none;display:flex;flex-direction:column;gap:4px}
.test-lbl{font-size:12px;color:var(--text-muted);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.test-lbl::before{content:"\25FB";color:var(--text-dim);font-size:10px;flex-shrink:0;margin-top:1px}

.fb-section{margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}
.fb-label{font-family:'Libre Baskerville',serif;font-size:13px;font-weight:700;color:var(--amber-soft);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.fb-label::before{content:"\270F";font-size:14px}
textarea.fb-ta{width:100%;min-height:96px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;padding:11px 13px;font-family:'Libre Baskerville',serif;font-size:13px;color:var(--text);resize:vertical;outline:none;line-height:1.7;transition:border-color .15s}
textarea.fb-ta::placeholder{color:var(--text-dim);font-style:italic}
textarea.fb-ta:focus{border-color:var(--amber)}
.fb-footer{display:flex;align-items:center;gap:10px;margin-top:9px}
.btn-save{background:var(--amber);color:#1a0e00;border:none;padding:7px 18px;border-radius:5px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.btn-save:hover{background:var(--amber-soft)}
.btn-save:active{transform:scale(.97)}
.btn-clr{background:none;border:1px solid var(--border-mid);color:var(--text-dim);padding:7px 13px;border-radius:5px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.btn-clr:hover{color:var(--text-muted);border-color:var(--text-dim)}
.save-st{font-size:11px;color:var(--text-dim);margin-left:auto;transition:all .3s}
.save-st.ok{color:var(--check)}

.md{font-size:14px;line-height:1.8;color:var(--text-muted)}
.md h1{font-family:'Libre Baskerville',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:20px;line-height:1.25}
.md h2{font-family:'Libre Baskerville',serif;font-size:18px;font-weight:700;color:var(--text);margin-top:36px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.md h3{font-family:'Libre Baskerville',serif;font-size:15px;font-weight:700;color:var(--text);margin-top:24px;margin-bottom:8px}
.md h4{font-size:11px;font-weight:600;color:var(--amber-soft);margin-top:20px;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.md p{margin-bottom:14px}
.md a{color:var(--amber-soft);text-underline-offset:2px}
.md a:hover{color:var(--amber)}
.md code{font-family:'Fira Code',monospace;font-size:12px;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;color:#d0c8b0}
.md pre{background:#0e0d0b;border:1px solid var(--border-mid);border-radius:6px;padding:16px;overflow-x:auto;margin:14px 0}
.md pre code{background:none;padding:0;font-size:12.5px;color:#c8c0a8}
.md ul,.md ol{padding-left:20px;margin-bottom:14px}
.md li{margin-bottom:5px}
.md strong{color:var(--text);font-weight:600}
.md em{color:#b8b0a0}
.md hr{border:none;border-top:1px solid var(--border-mid);margin:28px 0}
.md blockquote{border-left:3px solid var(--amber-border);padding:8px 16px;background:var(--amber-bg);margin:14px 0;border-radius:0 4px 4px 0}
.md table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.md th{background:var(--bg-card-alt);color:var(--text);padding:8px 12px;text-align:left;border:1px solid var(--border-mid);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.md td{padding:8px 12px;border:1px solid var(--border);color:var(--text-muted)}
.md tr:nth-child(even) td{background:rgba(255,255,255,.02)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp .18s ease-out}
</style>

const LD = {"variables-let-const":{"title":"1. let and const — names for values","slideTypes":["explanation","js-chip-assignment","js-workshop","exercise"],"explanationCount":4,"customScenes":[],"workshops":[{"title":"Workshop: declare and reassign","designNote":"Variables L1 workshop. Four steps: declare let, reassign let, declare const, combine in template literal. Surface: city/country travel theme. Distinct from chips (score/pi) and exercise (custom names).","steps":[{"i":"Use `let` to declare a variable called `city` and give it any string value. Then log it.","c":["Use `let` to declare a variable named `city`.","`city` should hold a string.","Log `city` with `console.log`."],"anyValues":true},{"i":"Reassign `city` to a different string. Note: no `let` on the second line — the variable already exists. Log it again.","c":["Reassign `city` to a string different from the initial value (no `let` on this line).","After your changes, `city` should still be a string."],"anyValues":true},{"i":"Below the existing code, declare a `const` called `country` and give it any country name. Log it.","c":["Use `const` to declare a variable named `country`.","`country` should hold a string.","Log `country` with `console.log`."],"anyValues":true},{"i":"Now try something that's NOT allowed: reassign `country` to a different string. Press Check and watch the console — JavaScript throws a TypeError because `country` was declared with `const`. The error itself is the lesson.","c":["Add a line that reassigns `country` to a string — `country = \"...\";`."],"anyValues":true}]},{"title":"Workshop: bank account","designNote":"L1 W2. Same teaching arc as W1 (let-reassign, const, template). Surface: bank account — balance + accountNumber.","steps":[{"i":"Declare a `let` called `balance` with any starting amount. Log it.","c":["Use `let` to declare `balance` with any number.","`balance` should be a number.","Log `balance`."],"anyValues":true},{"i":"Reassign `balance` so it grows by a deposit. Use `+` to add a number to `balance` itself. Log the new value.","c":["Grow `balance` by adding a deposit — use `balance = balance + N` or the shorthand `balance += N` (no `let` on this line)."],"anyValues":true},{"i":"Declare a `const` called `accountNumber` and give it any account-style string. Log it. The account number never changes.","c":["Use `const` to declare `accountNumber`.","`accountNumber` should be a non-empty string.","Log `accountNumber`."],"anyValues":true},{"i":"Build a summary line by joining strings with `+`. The `+` operator between strings glues them together — for example `\"Hello, \" + name` produces `\"Hello, Alice\"`. (Preview: this is called string concatenation, covered properly in the Strings chapter.)\n\nLog a single line that includes both `accountNumber` and `balance`, joined with `+`.","c":["Log a single line that mentions both `accountNumber` and `balance`.","Use `+` inside that `console.log` to join the parts together."],"anyValues":true}]},{"title":"Workshop: game scoreboard","designNote":"L1 W3. Same teaching arc. Surface: game scoreboard — score + playerName.","steps":[{"i":"Declare a `let` called `score` starting at any number. Log it.","c":["Use `let` to declare a variable named `score`.","`score` should be a number.","Log `score`."],"anyValues":true},{"i":"After a hit, reassign `score` to a different number. Log it.","c":["Reassign `score` to a number (no `let` on this line).","After your changes, `score` should still be a number."],"anyValues":true},{"i":"Declare a `const` called `playerName` with any name. Log it.","c":["Use `const` to declare `playerName`.","`playerName` should be a non-empty string.","Log `playerName`."],"anyValues":true},{"i":"Build a recap line using a TEMPLATE LITERAL. Backticks (`) let you embed a variable directly inside a string with `${variable}`. Example: `Hello, ${name}!`. (Preview: covered properly in the Strings chapter.)\n\nLog a single line including both `playerName` and `score` inside one template literal.","c":["Use a template literal that includes both `${playerName}` and `${score}`."],"anyValues":true}]},{"title":"Workshop: weather check","designNote":"L1 W4. Same teaching arc. Surface: weather — temperatureC + location.","steps":[{"i":"Declare a `let` called `temperatureC` with any number. Log it.","c":["Use `let` to declare a variable named `temperatureC`.","`temperatureC` should be a number.","Log `temperatureC`."],"anyValues":true},{"i":"The temperature changes — reassign `temperatureC` to a different number. Log it again.","c":["Reassign `temperatureC` to a number (no `let` on this line).","After your changes, `temperatureC` should still be a number."],"anyValues":true},{"i":"Declare a `const` called `location` with any place name. Log it.","c":["Use `const` to declare `location`.","`location` should be a non-empty string.","Log `location`."],"anyValues":true},{"i":"Log a forecast line including both `temperatureC` and `location`. Use this exact string:\n\nIn Hudiksvall the temperature is 23 degrees today.\n\n…where you replace `Hudiksvall` with the variable `location` and `23` with the variable `temperatureC`. You can either use string concatenation (`+`, what you used in W2) or template literals (backticks, what you used in W3). The line must match the wording, spacing, and punctuation exactly.","c":["The forecast line must reference both `location` and `temperatureC` as variables (not hard-coded text).","The console must show exactly: `In <location> the temperature is <temperatureC> degrees today.` (substitute your variable values)."],"anyValues":true}]}],"exercises":[{"title":"Lab: introduce yourself","prompt":"Use let and const to write a tiny self-introduction.\n\nUser stories:\n1. Declare a let called `age` with any number, then reassign it to a different number.\n2. Declare a const called `name` with any non-empty string.\n3. console.log a single sentence that includes both `name` and `age`.\n\nThere should be exactly one console.log line.","designNote":null,"anyValues":true,"tests":["Declares `age` with let exactly once and reassigns it","Declares `name` with const and a non-empty string","Console shows exactly one line","The logged line includes both the name and the age"]},{"title":"Lab: step counter","prompt":"A pedometer tracks steps walked across the day — the count grows as you walk more. Same `let` variable, updated multiple times.\n\nUser stories:\n1. Declare a let `stepsWalked` starting at 0.\n2. Reassign `stepsWalked` to three different positive numbers — morning, midday, and evening counts (each higher than the last).\n3. After EACH reassignment, console.log `stepsWalked` so the console shows the progression.\n\nExactly three console.log lines, each printing a different ascending step count.","designNote":null,"anyValues":true,"tests":["Declares `stepsWalked` with let starting at 0","Reassigns `stepsWalked` at least three times (no second `let`)","Console shows three different ascending step counts"]},{"title":"Lab: battery monitor","prompt":"A phone's battery drains over the day. Use the `-` or `-=` operator to subtract from the current value MULTIPLE times — each drain mutates the same variable.\n\nUser stories:\n1. Declare a let `batteryPercent` starting at 100.\n2. Drain it at least TWICE — each drain uses the `-` operator on the current value (e.g. `batteryPercent = batteryPercent - 27` or the shorthand `batteryPercent -= 27`). No second `let`.\n3. After EACH drain, console.log `batteryPercent` so the console shows the battery dropping.\n4. `batteryPercent` must end between 0 and 100 inclusive.\n\nAt least two drains, at least two console.log lines.","designNote":null,"anyValues":false,"tests":["Declares `batteryPercent` with let starting at 100","Drains `batteryPercent` at least twice using `-` or `-=`","Console shows the battery dropping (at least 2 lines, each lower than the last)","batteryPercent stays between 0 and 100 inclusive"]},{"title":"Lab: quiz scoreboard","prompt":"Run a small quiz and track two counters — answers correct and answers wrong — against a fixed total. This lab is about TWO let variables coexisting with one const.\n\nUser stories:\n1. Declare a const `totalQuestions` with a positive number (the quiz length).\n2. Declare a let `correctAnswers` starting at 0.\n3. Declare a let `wrongAnswers` starting at 0.\n4. Earn answers: add to BOTH `correctAnswers` and `wrongAnswers` using `+` or `+=` (the two together should equal `totalQuestions`).\n5. console.log a single line that includes ALL THREE values: `correctAnswers`, `wrongAnswers`, and `totalQuestions`.","designNote":null,"anyValues":true,"tests":["Declares `totalQuestions` with const and a positive number","Declares `correctAnswers` and `wrongAnswers` with let, both starting at 0","Adds to both counters using `+` or `+=` (no second `let`)","Console line includes all three values: correctAnswers, wrongAnswers, totalQuestions"]}]},"variables-types":{"title":"2. Types — what kind of value","slideTypes":["explanation","js-chip-assignment","js-workshop","exercise"],"explanationCount":3,"customScenes":[],"workshops":[{"title":"Workshop: types in action","designNote":"Variables L2 workshop. Four steps: declare three types, log typeof of each, observe \"5\" + 3, log a typeof. Surface: title/score/ready triple plus a visible coercion bug.","steps":[{"i":"Declare three variables — `title = \"Hello\"`, `score = 42`, and `ready = true`. Use `let` for all three.","c":["`title` should be a string.","`score` should be a number.","`ready` should be a boolean."],"anyValues":true},{"i":"Log the type of each variable using `typeof`. Three lines, three types.","c":["Use `typeof` on `title`, `score`, and `ready`.","Each `typeof` should be inside a `console.log(...)`."],"anyValues":false},{"i":"Below all your code, declare `let buggy = \"5\" + 3;` and log it. Watch what happens.","c":["Declare `buggy` with `\"5\" + 3`.","`buggy` should equal the string \"53\" — not the number 8.","Log `buggy` with `console.log`."],"anyValues":false},{"i":"Confirm your suspicion: log `typeof buggy`. The output proves the value is a string.","c":["Log `typeof buggy`."],"anyValues":false}]},{"title":"Workshop: receipt bug hunt","designNote":"L2 W2. Bug hunt arc — observe → diagnose with typeof → identify the string operand → fix by dropping the quotes. Distinct from W1 (basic tour) and W3/W4 (other coercion angles).","steps":[{"i":"Press Check to run the buggy receipt code as-is. `price` arrived from a form as text. The starter has `let total = price + quantity;` followed by a log — what does the console print?","c":["Don't change the starter on this step — just press Check and look at the console.","Make sure the starter `console.log(total)` is still there.","`total` should still be the buggy string `\"3950\"` on this step."],"anyValues":false},{"i":"Use `typeof` to confirm `total` isn't a number. Add `console.log(typeof total);` below the existing log.","c":["Add a `console.log(typeof total);` line.","The bug is still there — `total` should still be a string."],"anyValues":false},{"i":"Now find the culprit. Log `typeof price` and `typeof quantity` — one of them isn't what the receipt expected.","c":["Log `typeof price`.","Log `typeof quantity`.","Don't fix the bug yet — `price` should still be a string on this step."],"anyValues":false},{"i":"Fix it. Change the declaration of `price` so it's a number, not a string. After your fix, `total` should be the number `89` and `typeof total` should be `\"number\"`.","c":["`price` should now be declared as a number (no quotes).","`total` should now be the number `89`.","`typeof total` should now be `\"number\"`."],"anyValues":false}]},{"title":"Workshop: minus vs plus","designNote":"L2 W3. Asymmetric coercion: `+` concatenates when a string is involved, `-` always coerces to number. Distinct from W2 (bug hunt) and W4 (strict vs loose equality).","steps":[{"i":"Declare two operands that LOOK similar but have different types: `textNumber` as the string `\"5\"`, and `realNumber` as the number `3`. Log `typeof` of each to confirm.","c":["`textNumber` should be the string `\"5\"`.","`realNumber` should be the number `3`.","Log `typeof textNumber` and `typeof realNumber`."],"anyValues":false},{"i":"Now combine them with `+`. `console.log(textNumber + realNumber)` — what does it print? Because one side is a string, `+` GLUES them. The result is the string `\"53\"`.","c":["Log `textNumber + realNumber` (either order works).","The result should be a string (`+` with a string operand glues)."],"anyValues":false},{"i":"Now the surprise: combine the SAME operands with `-`. `console.log(textNumber - realNumber)`. `-` has no string meaning, so JS coerces `\"5\"` to the number `5`. The result is the number `2`.","c":["Log `textNumber - realNumber` (either order works).","The result should be a number — `-` always coerces."],"anyValues":false},{"i":"Confirm what just happened. Log `typeof (textNumber + realNumber)` and `typeof (textNumber - realNumber)`. Same operands, but the operator decides the type: `+` gave `\"string\"`, `-` gave `\"number\"`.","c":["Log `typeof (textNumber + realNumber)` (either operand order accepted).","Log `typeof (textNumber - realNumber)` (either operand order accepted)."],"anyValues":false}]},{"title":"Workshop: strict vs loose equality","designNote":"L2 W4. Strict vs loose equality. Distinct from W1 (typeof tour), W2 (bug hunt), and W3 (minus-vs-plus coercion).","steps":[{"i":"Declare two values that LOOK equal but have different types: `num` as the number `5`, `text` as the string `\"5\"`. Log them both, then log `typeof` of each so you can confirm the types differ.","c":["`num` should be the number `5`.","`text` should be the string `\"5\"`.","Log `typeof num` and `typeof text`."],"anyValues":false},{"i":"Compare them with the loose `==` operator. `console.log(num == text)`. Loose equality COERCES — it converts `\"5\"` to `5` before comparing, so the result is `true`.","c":["Log `num == text` using the LOOSE `==` operator.","`num == text` should be `true`."],"anyValues":false},{"i":"Now compare with strict `===`. `console.log(num === text)`. Strict equality DOES NOT coerce — it checks both the value AND the type. Since one is `number` and the other is `string`, the result is `false`. This is why `===` is the JS convention.","c":["Log `num === text` using STRICT `===`.","`num === text` should be `false`."],"anyValues":false},{"i":"One more surprise: `0` and `false` look unrelated, but loose equality says they're equal. Log `0 == false` (true — both falsy, coerced) and `0 === false` (false — different types). The takeaway: ALWAYS use `===`. It never lies about types.","c":["Log `0 == false`.","Log `0 === false`."],"anyValues":false}]}],"exercises":[{"title":"Lab: type detective","prompt":"Use typeof to investigate four expressions.\n\nUser stories:\n1. Declare `title = \"Hello\"`, `score = 42`, and `ready = true`.\n2. Log the typeof of each — three lines.\n3. Compute \"5\" + 3 and log the typeof of the result — one more line.\n4. There should be exactly four console.log lines, and the values logged should be the four type names.","designNote":null,"anyValues":true,"tests":["Console shows exactly four lines","First three lines are \"string\", \"number\", and \"boolean\" (any order)","The fourth line is \"string\" (the coercion result)","Code uses typeof at least four times"]},{"title":"Lab: bug hunt","prompt":"The starter has a coercion bug: `subtotal` is a string by accident, so `total` ends up as concatenated text instead of a sum. Fix the declaration so `total` is the correct number.\n\nUser stories:\n1. Find and fix the bug — only ONE line in the starter needs to change.\n2. After your fix, `subtotal` is a number, not a string.\n3. After your fix, `total` is the number `205` (200 + 5).\n4. Don't add or remove any logs — leave the existing ones in place.","designNote":null,"anyValues":false,"tests":["`subtotal` is now a number (not a string)","`total` is the number 205","Console still shows exactly two lines: `205` and `\"number\"`"]},{"title":"Lab: predict the result","prompt":"Log four expressions, each producing a different type. Predict each before running. The lab is about UNDERSTANDING how operators bend types.\n\nEach line should produce the exact result shown in parentheses:\n1. `5 + \"3\"` → `\"53\"` (string, because `+` glues when a string is involved)\n2. `\"5\" - 3` → `2` (number, because `-` coerces the string to a number)\n3. `true + 1` → `2` (number, because `true` becomes `1`)\n4. `\"5\" * 2` → `10` (number, because `*` coerces like `-`)\n\nLog each expression in order. Exactly four console.log lines.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are \"53\", 2, 2, 10 (in order)","Each expression appears in the source"]},{"title":"Lab: strict vs loose equality","prompt":"Log four comparisons that show how `==` and `===` disagree. Each pair has the SAME operands but a different operator — and the answers flip.\n\nEach line should produce the exact result shown in parentheses:\n1. `5 === \"5\"` → `false` (strict: different types)\n2. `5 == \"5\"` → `true` (loose: coerces, then compares)\n3. `0 === false` → `false` (strict: different types)\n4. `0 == false` → `true` (loose: both falsy, treated as equal)\n\nLog each comparison in order. Exactly four console.log lines.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are false, true, false, true (in order)","Code uses both `===` and `==`"]}]},"variables-operators":{"title":"3. Operators — doing things to values","slideTypes":["explanation","js-chip-assignment","js-workshop","exercise"],"explanationCount":2,"customScenes":[],"workshops":[{"title":"Workshop: simple math and checks","designNote":"Variables L3 workshop. Four steps: a subtraction, a modulo even-check, a > comparison, a strict !==. Surface: shopping/age check theme; deliberate mix of arithmetic and comparison to show the boolean result.","steps":[{"i":"Declare `let total = 100 - 25;` and log it. The result should be 75.","c":["Use `let` to declare `total = 100 - 25`.","`total` should equal 75.","Log `total` with `console.log`."],"anyValues":false},{"i":"Below that, declare `let isEven = 8 % 2 === 0;` and log it. The result should be a boolean.","c":["Use `%` and `===` in the expression assigned to `isEven`.","`isEven` should be the boolean true.","Log `isEven` with `console.log`."],"anyValues":false},{"i":"Declare `let bigger = 10 > 5;` and log it. The result is a boolean.","c":["Use `>` to compare 10 and 5.","`bigger` should be true.","Log `bigger`."],"anyValues":false},{"i":"Declare `let typeMatters = 10 === \"10\";` and log it. The strict check sees that the types differ.","c":["Use `===` to compare `10` and `\"10\"`.","`typeMatters` should be false — different types don't match strictly.","Log `typeMatters`."],"anyValues":false}]},{"title":"Workshop: tip calculator","designNote":"L3 W2. Surface: tip calculator. Touches *, +, > on numbers. Different scenario from W1's plain math.","steps":[{"i":"Declare `let bill = 200;` and log it.","c":["Use `let bill = 200`.","Log `bill`."],"anyValues":false},{"i":"Declare `let tip = bill * 0.15;` and log it. The tip should be 30.","c":["Use `bill * 0.15`.","`tip` should equal 30.","Log `tip`."],"anyValues":false},{"i":"Declare `let total = bill + tip;` and log it. Should be 230.","c":["Use `bill + tip`.","`total` should equal 230.","Log `total`."],"anyValues":false},{"i":"Compare against a 250 budget: declare `let underBudget = total < 250;` and log the boolean.","c":["Use `total < 250`.","`underBudget` should be true.","Log `underBudget`."],"anyValues":false}]},{"title":"Workshop: even or odd?","designNote":"L3 W3. Surface: even/odd classifier. Heavy focus on % and ===.","steps":[{"i":"Declare `let n = 7;` and log it.","c":["Use `let n = 7`.","Log `n`."],"anyValues":false},{"i":"Declare `let remainder = n % 2;` and log it. For 7, the remainder is 1.","c":["Use `n % 2`.","`remainder` should equal 1.","Log `remainder`."],"anyValues":false},{"i":"Declare `let isOdd = remainder === 1;` and log it. The boolean is true.","c":["Use `remainder === 1`.","`isOdd` should be true.","Log `isOdd`."],"anyValues":false},{"i":"Declare `let isEven = n % 2 === 0;` and log it. For 7, this is false — collapsing two operators into one expression.","c":["Use `n % 2 === 0`.","`isEven` should be false.","Log `isEven`."],"anyValues":false}]},{"title":"Workshop: threshold check","designNote":"L3 W4. Surface: thresholds. Touches >=, ===, and the type-strictness corner of ===.","steps":[{"i":"Declare `let temperature = 24;` and log it.","c":["Use `let temperature = 24`.","Log `temperature`."],"anyValues":false},{"i":"Declare `let isWarm = temperature >= 20;` and log it.","c":["Use `temperature >= 20`.","`isWarm` should be true.","Log `isWarm`."],"anyValues":false},{"i":"Declare `let isExact = temperature === 24;` and log it.","c":["Use `temperature === 24`.","`isExact` should be true.","Log `isExact`."],"anyValues":false},{"i":"Declare `let isString = temperature === \"24\";` and log it. Compare a number to a numeric STRING — strict equality fails.","c":["Use `temperature === \"24\"`.","`isString` should be false.","Log `isString`."],"anyValues":false}]}],"exercises":[{"title":"Lab: math and answers","prompt":"Compute and log four small answers.\n\nUser stories:\n1. Log the result of 10 % 3 (the remainder).\n2. Log the result of 7 * 8.\n3. Log the result of the comparison 10 > 5 (a boolean).\n4. Log the result of the comparison 10 === \"10\" (a boolean).\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","First line is 1 (10 % 3) and second is 56 (7 * 8)","Third line is true (10 > 5)","Fourth line is false (10 === \"10\")"]},{"title":"Lab: discount sale","prompt":"Compute and log four numbers for a 20% discount on a 250-kr item.\n\nUser stories:\n1. Log 250 * 0.20 (the discount amount).\n2. Log 250 - (250 * 0.20) (the price after discount).\n3. Log (250 - (250 * 0.20)) < 250 (cheaper than the original — true).\n4. Log (250 - (250 * 0.20)) === 200 (does it exactly equal 200 — true).\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are 50, 200, true, true (in order)","Code uses *, -, < and ===","No quotes around the numeric expressions"]},{"title":"Lab: multiple of three","prompt":"Use the modulo operator to test if 12 is a multiple of 3.\n\nUser stories:\n1. Log 12 (the number itself).\n2. Log 12 % 3 (the remainder — should be 0).\n3. Log 12 % 3 === 0 (is it a multiple of 3 — true).\n4. Log 12 % 3 !== 0 (is it NOT a multiple of 3 — false).\n\nExactly four console.log lines.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are 12, 0, true, false (in order)","Code uses %, ===, and !==","Lines 3 and 4 evaluate to a boolean"]},{"title":"Lab: voting age check","prompt":"Run four eligibility checks against the number 18.\n\nUser stories:\n1. Log 18 >= 18 (old enough to vote — true).\n2. Log 18 < 100 (under 100 — true).\n3. Log 18 === 18 (strictly equal to itself — true).\n4. Log 18 === \"18\" (strict equality with the string — false).\n\nExactly four console.log lines.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are true, true, true, false (in order)","Code uses >=, <, and ===","Every line evaluates to a boolean"]}]},"variables-special-values":{"title":"4. undefined, null, and NaN","slideTypes":["explanation","js-chip-assignment","js-workshop","exercise"],"explanationCount":3,"customScenes":[],"workshops":[{"title":"Workshop: special values up close","designNote":"Variables L4 workshop. Four steps: declare-without-assign (undefined), assign null, produce NaN via 0/0, verify with Number.isNaN. Surface emphasizes 'three kinds of nothing' arc.","steps":[{"i":"Declare `let score;` (no value). Then log it. The output is `undefined`.","c":["Declare `score` with `let` and no initial value.","`score` should be `undefined`.","Log `score`."],"anyValues":false},{"i":"Below that, declare `let answer = null;` and log it.","c":["Declare `answer` with the value `null`.","`answer` should be `null`.","Log `answer`."],"anyValues":false},{"i":"Declare `let oops = 0 / 0;` and log it. Watch what bad math produces.","c":["Declare `oops` with the expression `0 / 0`.","`oops` should be NaN — check with Number.isNaN(oops).","Log `oops`."],"anyValues":false},{"i":"Log `Number.isNaN(oops)` — the reliable way to confirm a value is NaN. The output should be `true`.","c":["Log `Number.isNaN(oops)`."],"anyValues":false}]},{"title":"Workshop: form fields","designNote":"L4 W2. Surface: form field lifecycle (declared → assigned). Touches undefined and null in a real-feeling scenario.","steps":[{"i":"Declare `let username;` (no value). Log it — the field is `undefined`.","c":["Declare `username` with `let` and no value.","`username` should be `undefined`.","Log `username`."],"anyValues":false},{"i":"The user types in their username — reassign `username` to `\"alice\"` and log it.","c":["Reassign `username` to a string (no `let` on this line).","`username` should be a non-empty string."],"anyValues":true},{"i":"The terms-checkbox starts unchecked, on purpose. Declare `let acceptedTerms = null;` and log it.","c":["Declare `acceptedTerms = null`.","`acceptedTerms` should be `null`.","Log `acceptedTerms`."],"anyValues":false},{"i":"The user takes action — reassign `acceptedTerms` to `true` and log it.","c":["Add a reassignment line for `acceptedTerms` (no `let`).","`acceptedTerms` should no longer be `null`."],"anyValues":true}]},{"title":"Workshop: parsing user input","designNote":"L4 W3. Surface: input parsing. Touches NaN and Number.isNaN.","steps":[{"i":"Declare `let typed = \"30\";` and `let parsed = Number(typed);`. Log `parsed`. It should be the number 30.","c":["Declare `typed = \"30\"`.","Declare `parsed = Number(typed)`.","`parsed` should equal 30.","Log `parsed`."],"anyValues":false},{"i":"Now an invalid input. Declare `let typedBad = \"abc\";` and `let parsedBad = Number(typedBad);`. Log it — you'll see `NaN`.","c":["Declare `typedBad = \"abc\"`.","Declare `parsedBad = Number(typedBad)`.","`parsedBad` should be NaN.","Log `parsedBad`."],"anyValues":false},{"i":"Verify with `Number.isNaN(parsedBad)` — should log `true`.","c":["Log `Number.isNaN(parsedBad)`."],"anyValues":false},{"i":"Compare with `Number.isNaN(parsed)` — should log `false`. The valid number is, well, a valid number.","c":["Log `Number.isNaN(parsed)`."],"anyValues":false}]},{"title":"Workshop: optional fields","designNote":"L4 W4. Surface: optional middle name. Distinguishes null (intentional) from undefined (never set), and exposes typeof null === 'object' gotcha.","steps":[{"i":"Declare three name parts: `firstName = \"Alice\"`, `middleName = null` (the lesson — intentionally empty), and `lastName = \"Smith\"`. Log all three on separate lines.","c":["`firstName` should be a non-empty string.","`middleName` should be `null` (intentionally empty).","`lastName` should be a non-empty string.","Log all three."],"anyValues":true},{"i":"Confirm middleName is null with `console.log(middleName === null);` — should log `true`.","c":["Use `middleName === null` inside `console.log`."],"anyValues":false},{"i":"Now the famous JS gotcha: log `typeof middleName`. The result is `\"object\"`, not `\"null\"`.","c":["Log `typeof middleName`."],"anyValues":false},{"i":"Compare with `undefined`. Declare `let nickname;` (no value) and log `nickname === undefined` — should be `true`.","c":["Declare `nickname` with no value.","Log `nickname === undefined`."],"anyValues":false}]}],"exercises":[{"title":"Lab: special-values tour","prompt":"Show each of the special values in turn.\n\nUser stories:\n1. Declare a variable with `let` and no value, then log it. The output should be `undefined`.\n2. Declare a variable with the value `null` and log it. The output should be `null`.\n3. Cause a NaN (e.g. `0 / 0` or `Number(\"abc\")`) and log it. The output should be `NaN`.\n4. After your NaN line, log `Number.isNaN(yourNanVariable)` — the output should be `true`.\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","First line is \"undefined\" and second is \"null\"","Third line is \"NaN\"","Fourth line is \"true\" and code uses Number.isNaN"]},{"title":"Lab: chat session","prompt":"Show the four stages of a chat session's state.\n\nUser stories:\n1. Declare a variable with `let` and no value, then log it (undefined).\n2. Declare a variable with the value `null`, then log it.\n3. Reassign the first variable to a non-empty string and log it.\n4. Reassign the second variable to `true` and log it.\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":true,"tests":["Console shows exactly four lines","First line is \"undefined\" and second is \"null\"","Third line is a non-empty string","Fourth line is \"true\""]},{"title":"Lab: validate guest count","prompt":"Parse two RSVP strings and use Number.isNaN to verify the results.\n\nUser stories:\n1. Log `Number(\"4\")` (a successful parse — 4).\n2. Log `Number(\"many\")` (a failed parse — NaN).\n3. Log `Number.isNaN(Number(\"many\"))` (true).\n4. Log `Number.isNaN(Number(\"4\"))` (false).\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are 4, NaN, true, false (in order)","Code uses Number(...) at least four times","Code uses Number.isNaN at least twice"]},{"title":"Lab: null vs undefined","prompt":"Show how `null` and `undefined` look the same — and aren't.\n\nUser stories:\n1. Log `null === null` (true).\n2. Log `null === undefined` (false — strict equality cares about type).\n3. Log `typeof null` (the famous \"object\" gotcha).\n4. Log `typeof undefined` (\"undefined\").\n\nExactly four console.log lines, in this order.","designNote":null,"anyValues":false,"tests":["Console shows exactly four lines","Lines are true, false, object, undefined (in order)","Code uses strict equality (===)","Code uses typeof at least twice"]}]},"wt-variables-0":{"title":"Walkthrough: tip calculator","slideTypes":["js-workshop"],"explanationCount":0,"customScenes":[],"workshops":[{"title":"Walkthrough: tip calculator","designNote":"Variables-topic walkthrough — 20 cumulative steps. Each step adds one line or two and keeps the prior code intact. Touches every Variables lesson: let/const, types, operators, special values. Console-only (no DOM). Sweden — kr.","steps":[{"i":"Start the tip calculator. Declare a `const` named `tipPercent` and set it to `0.15` (15%). It's a `const` because the rate is fixed for this script.","c":["Use `const` to declare `tipPercent`.","`tipPercent` should be a number."],"anyValues":true},{"i":"Below `tipPercent`, declare `let bill = 200;`. The bill might change later (a different table, a recalculated total), so use `let`.","c":["Use `let` to declare `bill`.","`bill` should be a number."],"anyValues":true},{"i":"Compute the tip. Add `let tipAmount = bill * tipPercent;` — that's a number (`200 * 0.15`) which equals `30`.","c":["Compute `tipAmount` as `bill * tipPercent`.","`tipAmount` should equal `bill * tipPercent`."],"anyValues":true},{"i":"Add the tip to the bill. Declare `let total = bill + tipAmount;`. With a 200 kr bill and 30 kr tip, `total` becomes `230`.","c":["Declare `total` as `bill + tipAmount`.","`total` should equal `bill + tipAmount`."],"anyValues":true},{"i":"Log the total: `console.log(total);`. Press Check — you'll see `230` in the console below the editor.","c":["Call `console.log(total)`.","`total` should still be a number at this point."],"anyValues":true},{"i":"Now reassign `bill` to `350` — note: NO `let` on this line. Reassignment uses just `=` with the existing variable. (This is why we picked `let` for `bill`.)","c":["Reassign `bill` to a new number (no `let`).","After the reassignment, `bill` should still be a number."],"anyValues":true},{"i":"Recompute `tipAmount` and `total` after the new `bill`. Both already exist, so reassign without `let`:\n\n`tipAmount = bill * tipPercent;`\n`total = bill + tipAmount;`","c":["Reassign `tipAmount` (no `let`).","Reassign `total` (no `let`).","After your changes, `total` should still equal `bill + tipAmount`."],"anyValues":true},{"i":"Log the new total. Add another `console.log(total);` so the console now shows two lines: `230` and `402.5`.","c":["Call `console.log(total)`.","`total` should still be a number at the end."],"anyValues":true},{"i":"Add a customer name. Declare `const customer = \"Astrid\";` and log a sentence using string concatenation with `+`:\n\n`console.log(customer + \" owes \" + total + \" kr\");`","c":["Declare `const customer` with a non-empty string.","Log a line that joins strings with `+` and includes both `customer` and `total`."],"anyValues":true},{"i":"Replace concatenation with a TEMPLATE LITERAL — backticks let you embed variables with `${variable}`.\n\nAdd this line:\n\n`` console.log(`${customer} owes ${total} kr`); ``\n\n(Preview: covered properly in the Strings chapter.)","c":["Use a template literal that includes both `${customer}` and `${total}`."],"anyValues":true},{"i":"VIP customers get a 20% bigger tip. Declare `const isVip = true;`, then bump the tip with a multiplier:\n\n`tipAmount = tipAmount * (1 + 0.2 * isVip);`\n`total = bill + tipAmount;`\n\nWhy does this work without an `if`? When JS does math on a boolean it COERCES it to a number — `true` → `1`, `false` → `0`. So `1 + 0.2 * isVip` becomes `1.2` when `isVip` is true, `1.0` when false. (Same coercion idea as Lesson 2.)","c":["Declare `const isVip` set to a boolean.","Reassign `tipAmount` using `tipAmount * (1 + <number> * isVip)`.","After the VIP bump, `total` should still be a number."],"anyValues":true},{"i":"Use a comparison operator to flag a small bill. Declare `let isCheap = bill < 100;`. Comparison operators (`<`, `>`, `<=`, `>=`, `===`, `!==`) always produce a boolean — here, `350 < 100` is `false`.","c":["Use `<` to compare `bill` to a number.","`isCheap` should be a boolean (comparisons always are)."],"anyValues":true},{"i":"Log the comparison result: `console.log(isCheap);`.","c":["Call `console.log(isCheap)`."],"anyValues":true},{"i":"`typeof` reports the datatype as a string. Add three lines:\n\n`console.log(typeof tipPercent);`  // \"number\"\n`console.log(typeof customer);`    // \"string\"\n`console.log(typeof isVip);`       // \"boolean\"","c":["Log `typeof tipPercent`.","Log `typeof customer`.","Log `typeof isVip`."],"anyValues":true},{"i":"Demonstrate string vs number coercion. Add two lines:\n\n`console.log(\"5\" + 3);`         // \"53\" — `+` with a string is concatenation\n`console.log(Number(\"5\") + 3);` // 8  — converting first gives real addition","c":["Log a string number `+` a real number (the concatenation case).","Log `Number(\"...\") + <number>` (the conversion case)."],"anyValues":true},{"i":"Declare a variable without a value: `let middleName;`. JavaScript fills it with the special value `undefined`. Log it — the console will show `undefined`.","c":["Declare `middleName` with `let` and no initial value.","Log `middleName`.","`middleName` should be `undefined`."],"anyValues":true},{"i":"Some math produces `NaN` (Not-a-Number). Add:\n\n`let bogus = \"abc\" * 2;`\n`console.log(bogus);`              // NaN\n`console.log(Number.isNaN(bogus));` // true\n\n`Number.isNaN` is the safe way to check — `NaN === NaN` is famously `false`.","c":["Declare `bogus` from a string * number expression.","Log `bogus`.","Log `Number.isNaN(bogus)`."],"anyValues":true},{"i":"Guard `total` against NaN. First, deliberately pollute it: `total = total + bogus;` (adding a number to NaN gives NaN). Then heal it with a NaN-aware fallback using a ternary:\n\n`total = Number.isNaN(total) ? 0 : total;`\n\nA ternary is `condition ? whenTrue : whenFalse` — preview from the Conditionals chapter, but the shape is small enough to use here.","c":["Add `total = total + bogus;`.","Guard with `Number.isNaN(total)` and a ternary that falls back to a number.","After the guard, `total` should be a number (the fallback)."],"anyValues":true},{"i":"Print a final summary line with a template literal that includes `customer`, `bill`, `tipAmount`, and `total`. For example:\n\n`` console.log(`${customer}: bill ${bill} kr, tip ${tipAmount} kr, total ${total} kr`); ``","c":["Use a template literal that interpolates `customer`, `bill`, `tipAmount`, and `total`.","Pass that template literal to `console.log`."],"anyValues":true},{"i":"Bonus polish — round to 2 decimals. Add:\n\n`const roundedTotal = Math.round(total * 100) / 100;`\n`console.log(roundedTotal);`\n\nMultiplying by 100, rounding, then dividing by 100 keeps two decimal places. (Since `total` is currently `0`, `roundedTotal` is also `0` — try changing earlier numbers to see other values.)","c":["Declare `const roundedTotal` using `Math.round(total * 100) / 100`.","Log `roundedTotal`.","`roundedTotal` should be a finite number."],"anyValues":true}]}],"exercises":[]},"ch-variables-0":{"title":"Challenge: budget tracker","slideTypes":["exercise"],"explanationCount":0,"customScenes":[],"workshops":[],"exercises":[{"title":"Challenge: budget tracker","prompt":"Build a tiny budget tracker that reports your monthly remainder.\n\nUser stories:\n1. Declare `income` as a non-negative number.\n2. Declare `fixedExpenses` as a non-negative number.\n3. Declare `variableExpenses` as a non-negative number.\n4. Compute `totalExpenses` from the two expense values.\n5. Compute `remainder = income - totalExpenses`.\n6. Use a comparison operator (`>`, `<`, `===`, etc.) somewhere in your code.\n7. Use `Number.isNaN` somewhere to guard against a NaN result.\n8. Use BOTH `let` and `const` at least once.\n9. Use a template literal (backticks with `${}`) somewhere.\n10. Console output has at least 6 lines.\n11. One console line includes the remainder amount.\n12. One console line includes one of these category words: \"saver\", \"breaking even\", or \"deficit\".","designNote":"Variables-topic challenge: budget tracker. Single-shot freeform exercise applying every Variables lesson: L1 — let/const for declaration choices, L2 — number type and typeof/coercion awareness, L3 — arithmetic and comparison operators, L4 — Number.isNaN for sanitising bad input. 12 user stories: 6+ console lines, the right declarations, the right arithmetic, a comparison, a Number.isNaN guard, and a category label.","anyValues":true,"tests":["Declares `income` as a non-negative number","Declares `fixedExpenses` as a non-negative number","Declares `variableExpenses` as a non-negative number","Computes `totalExpenses` from the two expense values","Computes `remainder` as income minus totalExpenses","Uses a comparison operator somewhere","Uses `Number.isNaN` somewhere","Uses both `let` and `const` at least once","Uses a template literal (backticks with `${...}`)","Console output has at least 6 lines","One console line mentions the remainder amount","One console line contains \"saver\", \"breaking even\", or \"deficit\""]}]},"conditionals-crosswalk":{"title":"1. Crosswalk — if and else","slideTypes":["explanation","js-chip-assignment","js-typed-assignment","js-workshop","exercise"],"explanationCount":9,"customScenes":["crosswalk","comparisons-table","crosswalk-if-trace","crosswalk-if-else-trace","crosswalk-strict-trace"],"workshops":[{"title":"Workshop: password check","designNote":"L1 if/else workshop. Surface chosen to differ from chips (signal) and exercise (fortune picker). Five steps build a 2-branch chain. String labels are free (typeof check); the lesson is the if/else shape and the .length comparison.","steps":[{"i":"
