<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#13120f;--bg-sidebar:#0f0e0c;--bg-card:#1c1b17;--bg-card-alt:#201f1a;
  --border:#2e2b25;--border-mid:#3d3a33;
  --text:#e8e2d4;--text-muted:#a09890;--text-dim:#5c564e;
  --amber:#d4913a;--amber-soft:#e8b460;--amber-bg:#2a2010;--amber-border:#4a3820;
  --blue:#5b8db5;--blue-bg:#0e1f2e;--blue-border:#1a3a5c;
  --rust:#c47b50;--rust-bg:#2a1508;--rust-border:#4a2510;
  --green:#6ea86e;--green-bg:#102010;--check:#5ea870;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

#hdr{height:48px;background:var(--bg-sidebar);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;z-index:10}
#hdr-logo{width:260px;flex-shrink:0;padding:0 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:2px}
#hdr-logo .ey{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:500}
#hdr-logo .ti{font-family:'Libre Baskerville',serif;font-size:14px;color:var(--text)}
#hdr-tabs{display:flex;align-items:center;gap:4px;padding:0 18px;border-right:1px solid var(--border)}
#hdr-tabs a{font-size:12px;color:var(--text-muted);text-decoration:none;padding:5px 12px;border-radius:4px;transition:all .12s;border:1px solid transparent}
#hdr-tabs a:hover{color:var(--text);background:rgba(255,255,255,.03)}
#hdr-tabs a.cur{color:var(--amber-soft);background:var(--amber-bg);border-color:var(--amber-border)}
#hdr-meta{display:flex;align-items:center;padding:0 20px;margin-left:auto;font-size:12px;color:var(--text-muted);gap:10px}
#hdr-meta b{color:var(--amber-soft);font-weight:600}
.export-btn{background:none;border:1px solid var(--border-mid);color:var(--text-muted);padding:5px 11px;border-radius:4px;font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;font-weight:500}
.export-btn:hover{color:var(--amber-soft);border-color:var(--amber-border);background:var(--amber-bg)}
.export-btn.copied{color:#1a0e00;background:var(--amber);border-color:var(--amber)}
.clear-all-btn:hover{color:#e89090;border-color:#6a2828;background:rgba(122,40,40,.18)}

#app{display:flex;flex:1;overflow:hidden}
#sidebar{width:260px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding-bottom:40px}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:2px}

.ng{margin-top:4px}
.ng-btn{width:100%;background:none;border:none;cursor:pointer;padding:9px 14px 6px;display:flex;align-items:center;gap:7px;color:var(--text-muted);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Sans',sans-serif;transition:color .15s}
.ng-btn:hover{color:var(--text)}
.ng-btn .arr{font-size:7px;transition:transform .2s;display:inline-block;margin-right:1px}
.ng.closed .arr{transform:rotate(-90deg)}
.ng.closed .ng-body{display:none}

.nt{margin-top:1px}
.nt-lbl{padding:4px 14px 3px 22px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
.nt-lbl .arr{font-size:7px;transition:transform .15s;color:var(--text-dim)}
.nt.closed .arr{transform:rotate(-90deg)}
.nt.closed .nt-body{display:none}

.ni{display:flex;align-items:center;padding:5px 12px 5px 28px;cursor:pointer;font-size:12.5px;color:var(--text-muted);border-left:2px solid transparent;transition:all .12s;gap:5px;line-height:1.3}
.ni:hover{color:var(--text);background:rgba(255,255,255,.03)}
.ni.active{color:var(--amber-soft);border-left-color:var(--amber);background:var(--amber-bg)}
.ni .fdot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-left:auto;display:none}
.ni.has-note .fdot{display:block}
.ni .vbadge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500;flex-shrink:0}
.vbadge-w{background:var(--green-bg);color:var(--green)}
.vbadge-c{background:var(--rust-bg);color:var(--rust)}

#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:40px 56px;scroll-behavior:smooth}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-track{background:transparent}
#content::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:3px}
#ci{max-width:860px;margin:0 auto}
body.lessons #content{padding:40px 36px}
body.lessons #ci{max-width:none;margin:0}

#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dim)}
#empty .big{font-family:'Libre Baskerville',serif;font-size:20px;color:var(--text-muted)}
#empty .sm{font-size:13px}

.c-ey{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
.c-title{font-family:'Libre Baskerville',serif;font-size:26px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:14px}
.c-hdr{margin-bottom:28px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:10px;font-weight:500;padding:3px 9px;border-radius:4px;letter-spacing:.04em}
.b-expl{background:#1e1e1e;color:var(--text-muted);border:1px solid var(--border-mid)}
.b-wksh{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-exer{background:var(--rust-bg);color:var(--rust);border:1px solid var(--rust-border)}
.b-chip{background:#1a1a2e;color:#8080d4;border:1px solid #2a2a4a}
.b-type{background:#2e1a2e;color:#c878c8;border:1px solid #4a2a4a}
.b-scene{background:#0e1e20;color:#6ebaba;border:1px solid #1a3a3e}
.b-assign{background:#1e1a10;color:#a89060;border:1px solid #3a3020}

.design-note{background:var(--amber-bg);border:1px solid var(--amber-border);border-left:3px solid var(--amber);padding:11px 15px;border-radius:0 6px 6px 0;font-size:12.5px;color:#c8a870;line-height:1.6;margin-bottom:24px;font-style:italic}
.design-note::before{content:"Design note";display:block;font-style:normal;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
.dn-wrap{padding:13px 15px;border-bottom:1px solid var(--border)}
.dn-wrap .design-note{margin-bottom:0}

/* ─── Tabs ────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{background:none;border:none;font-family:'DM Sans',sans-serif;color:var(--text-muted);font-size:12px;font-weight:500;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:color .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber-soft);border-bottom-color:var(--amber)}
.tab .count{font-size:10px;background:#1e1e1e;padding:1px 7px;border-radius:8px;color:var(--text-muted);border:1px solid var(--border-mid);font-weight:500;line-height:1.4}
.tab.active .count{background:var(--amber-bg);color:var(--amber-soft);border-color:var(--amber-border)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.empty-tab{padding:48px 20px;text-align:center;color:var(--text-dim);font-style:italic;font-size:13px;border:1px dashed var(--border);border-radius:8px}

/* ─── Cards grid ─────────────────────────────────────────── */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cards-grid{grid-template-columns:1fr}}

.card-fb-ta{width:100%;min-height:54px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:5px;padding:8px 11px;font-family:'Libre Baskerville',serif;font-size:12px;color:var(--text);resize:vertical;outline:none;line-height:1.6;transition:border-color .15s}
.card-fb-ta::placeholder{color:var(--text-dim);font-style:italic}
.card-fb-ta:focus{border-color:var(--amber)}
.card-fb-bar{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:22px}
.card-fb-clr{background:none;border:1px solid var(--border-mid);color:var(--text-dim);width:22px;height:22px;border-radius:4px;font-size:14px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:'DM Sans',sans-serif}
.card-fb-clr:hover{color:#e89090;border-color:#6a2828;background:rgba(122,40,40,.18)}
.card-fb-st{font-size:10px;color:var(--text-dim);transition:all .25s;margin-left:auto;min-height:13px}

.scene-tag{font-size:11px;background:#0e1e20;color:#6ebaba;border:1px solid #1a3a3e;padding:3px 10px;border-radius:4px;font-family:'Fira Code',monospace}

.sec-hd{font-family:'Libre Baskerville',serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:16px;margin-top:36px}

.wk-block{margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}

# Frontendkurser — Project Instructions

## Working Style

Unless the user's message starts with **"Do this:"**, give your input on the
proposed change BEFORE implementing it — surface trade-offs, alternatives,
and any concerns. This is intentional friction: it gives the user one more
chance to think about the change before code lands.

When the user opens with "Do this:" they've already decided. Skip the input
step and just execute.

## Post-implementation rule review

After finishing an implementation — **before** reporting it done — scan
the companion docs and CLAUDE.md itself for rules that this change made
stale, missing, or wrong. The rules drift silently if you skip this.

- Changed how a slide view is laid out, or the slide chrome? → check
  [SLIDE_UI.md](SLIDE_UI.md).
- Added a new authoring field, flag, instruction style, or check
  pattern? → check [AUTHORING.md](AUTHORING.md).
- Added, renamed, or repurposed a component / runtime file / lesson
  module? → update [CODEBASE_MAP.md](CODEBASE_MAP.md).
- Established a new workflow rule (e.g. "always run X before Y") that
  applies to every session? → put it in CLAUDE.md.

If a rule needs to change, edit it in the **same change as the code**,
not as a follow-up. A rule is only as useful as its currency.

## Lab & Workshop authoring (must run the harness)

When you author or modify a Monaco lab exercise (`kind: "exercise"`) **or**
a Workshop slide (`kind: "js-workshop"`) in any `app/src/lessons/**/*.ts`
file, you MUST run the harness in the same change:

```
cd app && npx tsx scripts/test-labs.ts
```

Confirm all assertions pass before reporting the lab/workshop as done.

**Forbidden:** claiming a lab or workshop is "ready" or "tested" without a
green run of the harness in the current session. Reading the assertion
strings is not testing.

Skipping the harness ships assertions with regex typos, off-by-one bugs, or
impossible requirements — bugs invisible at the TypeScript build level
because assertions and `requirePattern`s are strings/regexes.

## Design tokens (workbook palette)

The project ships a workbook-style palette and type scale (Fraunces /
Inter / JetBrains Mono) wired through
[`app/src/styles/tokens.ts`](app/src/styles/tokens.ts) and
[`app/src/topics.ts`](app/src/topics.ts). When you restyle a component:

- **Reach for `tokens.<role>` first.** Use `tokens.card.surface`,
  `tokens.button.primary`, `tokens.feedback.success`, `tokens.text.h1` /
  `h2` / `h3` / `eyebrow`, `tokens.step.cell` etc. Don't sprinkle the
  Tailwind utility chains inline — palette tweaks should be one-file
  changes inside `tokens.ts`.
- **Topic accent colours are HEX values, not class strings.** Tailwind's
  JIT only generates utilities whose class strings appear literally in
  source, so `text-[${hex}]` constructed at runtime silently no-ops.
  Read `accentFor(topicId, courseId).fgHex` / `.bgHex` and apply via
  inline `style={{ color, background }}`. See `topics.ts` for examples.
- **Read the active accent via `useAccent()`.** `<AccentProvider>` is
  set per route in `App.tsx`; descendant slide views and step counters
  read it instead of receiving a prop.
- **Feedback bands are semantic, not topic-tied.** Success uses teal
  (same hue as Conditionals); error uses rose (same hue as Functions).
  This is intentional reuse — feedback colours belong to the topic
  palette so the system stays calm. Use `tokens.feedback.success` /
  `.error` / `.idle`.

## Language (English-only)

The project is English-only. The Swedish option has been retired:
all `{ en, sv }` `Loc` literals have been collapsed to plain strings,
the `LanguageToggle` component is gone, and `t()` is now an identity
function. `Lang` / `useLang` / `LanguageContext` remain as no-op stubs
for backward compatibility with code that still passes a `lang` value
around — new code should ignore them and treat `Loc` as `string`.

Just author plain strings. No `{ en, sv }`, no `t(value, lang)`, no
double-authoring.

## Companion docs

- [AUTHORING.md](AUTHORING.md) — full authoring rules (workshop
  value-flexibility, per-step `flexibility` flag, soft-introducing
  not-yet-taught concepts, bullet point convention, chip puzzle ordering,
  tier prefixes). Read this whenever you touch a `lessons/**/*.ts` file.
- [SLIDE_UI.md](SLIDE_UI.md) — slide chrome conventions (title row,
  breadcrumb, font/theme/help controls, jump dots, centering, responsive
  breakpoints). Read this before adding a new `slide.kind` view or
  modifying chrome.
- [CODEBASE_MAP.md](CODEBASE_MAP.md) — one-line-per-file map of `app/src/`
  grouped by role. Update it whenever you add a component or change a

<script type="x-markdown" id="doc-authoring">
# Lesson, Workshop & Exercise Authoring

Rules for writing or editing content in `app/src/lessons/**/*.ts`. The
top-level harness requirement lives in [CLAUDE.md](CLAUDE.md). The
project is English-only — author plain strings, never `{ en, sv }`.
Everything else is here.

## Exercise tier (`kind: "exercise"`)

Each exercise lab needs a known-good solution in
[scripts/test-labs.ts](app/scripts/test-labs.ts)'s `SOLUTIONS` array —
student code that satisfies every user story. The harness mimics the
iframe runner: vm sandbox, console capture, `window.__userSrc`, and
runs every assertion exactly as the iframe would.

When the iframe runner itself changes (new globals exposed, capture
behavior), update the harness's sandbox setup to mirror the change so
the two stay in sync.

## Workshop tier (`kind: "js-workshop"`)

**No SOLUTIONS array entry needed** — the harness walks every workshop
slide and runs each step's authored `reveal` field through
`runWorkshopChecks` (the same function the React layer calls). The
reveal IS the canonical solution.

Authoring rule: **every step's `reveal` must pass that step's own
`checks`.** The harness fails the run if it doesn't. If you change the
runner itself (`app/src/runtime/workshopRunner.ts`), the runner-invariants
smoke test at the end of `test-labs.ts` should also be updated to cover
the new behavior.

## Values pill — exact vs any (`anyValues?: boolean`)

Every `JsWorkshopSlide` step and every `ExerciseSlide` renders a small
pill that tells the student up-front whether the values shown in the
spec are mandatory or just examples:

- **EXACT VALUES — keep the numbers as shown** (amber, the default).
  The checks pin specific numbers/strings/booleans from the spec. Don't
  set `anyValues` — the default is exact.
- **ANY VALUES — pick your own (same type)** (teal). The checks accept
  any value of the matching datatype. Set `anyValues: true` on the step
  or slide.

Author the flag based on **what the checks actually accept**, not what
the instruction text says. Per the workshop value-flexibility rule
(below), instructions always propose one concrete value as if required.
The pill is the student-facing signal of which mode the lab is in —
it replaces the old `FlexibilityHelpButton` "?" affordance so students
don't need to click anything to know.

The two are mutually exclusive: a lab is *either* exact-values *or*
any-values, never both. There is no third state. When in doubt, default
to exact — pinned-value tests are stricter and surface authoring
mistakes earlier.

## Design notes (author-only)

Both `JsWorkshopSlide` and `ExerciseSlide` accept an optional
`designNote?: string` — the Exercism `design.md` equivalent. The field is
**never rendered in the app**. It lives in source for the author's own
reference and for tooling (e.g. the course-review HTML) that surfaces it.

Write a design note when the slide's *intent* isn't obvious from the
checks alone. Useful things to capture:

- The lesson scope or angle the slide is meant to test ("L1 reassignment
  with numeric values — bank deposit").
- How this slide differs from its siblings (see the variety rule below).
- Surface choice and why ("bank account, not the chips' score/pi or the
  lab's custom names").
- Trade-offs between what's pinned and what's flexible.

A note is plain prose, authored on the slide itself. One short paragraph
is enough; longer if a topic-level walkthrough/challenge needs more
context. Author it inline on the slide rather than as a JSDoc block
above the export — the field is the canonical home.

## Variety rule (workshops and labs)

Every workshop within a lesson — and every lab/exercise within a lesson
— must differ from its siblings in **both** dimensions:

1. **Context (surface / scenario)** — what's the story? bank account,
   step counter, battery, coffee shop.
2. **What the student is asked to do** — what concept or skill is the
   activity testing? declare-and-log, operator mutation, multiple
   reassignments, string concatenation, template literals, bug-hunting
   a coercion, predicting a type, comparing strict vs loose equality,
   const-as-formula-constant, etc.

A swap of surface (city → bank → game → weather) is **not** enough by
itself. If the four workshops in a lesson all walk the student through
the identical pattern with only the variable names changed, it's filler
— students get bored. Each workshop/lab should teach or apply a
distinct piece of the lesson's scope.

The same applies between a workshop and its companion lab: the lab
should test a *different angle* than the workshop on the same surface
did. If the workshop walked through "declare-reassign-const-log" and
the lab does the same thing without scaffolding, the lab adds nothing.
Pick a different concept the lesson covers and build the lab around
that.

When you can't find four distinct angles within a lesson's scope, the
lesson probably doesn't need four workshops or four labs — collapse to
two or three rather than padding with repetition.

### Workshop value-flexibility rule

Default to **shape over value** for *values*. Workshop checks should
validate the *shape* of the student's code (used `let`, used a template
literal, the variable is a string/number/boolean, the source has a
reassignment) — not pin a specific value the student must type. Use
`typeof` asserts and structural `requirePattern` regexes; let the
student pick strings and numbers freely at the **check** level.

**Names are always pinned.** When the instruction proposes a variable
name ("Declare a `let` called `balance`..."), the check **pins** that
name. The student is using Monaco with autocomplete — typing `balance`
exactly costs nothing, and the consistency between instruction and
check keeps the lab debuggable. Name-flexibility was the freeCodeCamp
spelling-pain remedy; we don't have that pain. There is no flag for
name-flexibility — names are not configurable.

**Instruction style: write a direct directive, never a hedge.**
Even when the check accepts any value, the instruction text should
propose one concrete value as if it were required:

- Good: *"Declare a `let` called `city` and set it to `\"Stockholm\"`."*
- Bad:  *"Declare a `let` called `city` — set it to any string (e.g. `\"Stockholm\"`, but anything works)."*

The hedge belongs in the **ANY VALUES** pill, not the instruction. The
pill is always visible above each step / slide, so the student sees
which mode the lab is in without clicking anything. Two groups of
students get served by this split: those who want a preassigned value
follow the instruction directly; those who want their own read the
pill and substitute.

If a step *does* require a specific value because the value itself is
the teaching point (e.g., `100 - 25 === 75` to teach subtraction,
`8 % 2 === 0` to teach modulo, `Number.isNaN(0 / 0)` to teach NaN), the
instruction is the same direct style — and the check pins the value AND
the step is left as default (`anyValues` unset). The student sees the
**EXACT VALUES** pill and knows the numbers matter.

The forbidden combination is **vague instruction + value-pinning check**.
Don't write "use any number" then assert `=== 75`.

### Hint vs instruction (don't leak the answer)

Workshop steps accept an optional `hint?: Loc`. The student sees the
instruction by default; clicking "Hint" in the title row reveals the
hint inline.

**Authoring rule**: never put the literal answer (a full code line, a
formula, an expression like `balance + 250`) in the **instruction**. Put
it in `hint`. The instruction stays directional ("Increase `balance` by
a deposit. Log the new value."), the hint is the safety net.

The split lets two groups of students get served:
- Read the instruction, infer the code, and try it cold.
- Read the instruction, get stuck, click Hint, see the literal answer.

When in doubt: if removing the backticked code from your instruction
would make it ambiguous, the instruction was carrying the answer — move
that code to `hint` and rephrase the instruction to describe the
*intent* instead.

Naming a value (`balance = 1000`) inline is still fine when the value is
arbitrary — students seeing the **ANY VALUES** pill can substitute. But
a formula or an exact line of code never belongs in the instruction.

### Soft-introducing not-yet-taught concepts

When a workshop step uses a concept the student hasn't been formally
taught yet (e.g. `+` string concatenation in L1 W2 before strings are
covered, or template literals in L1 W3), explicitly soft-intro it in
the instruction text with a 1–2 sentence preview disclaimer. The
instruction grows, but the student isn't asked to type a black-box
token. Don't introduce a concept silently and rely on the regex to
"teach" it — that's a check pretending to be a lesson.

## Bullet points in narration

When authoring explanation narration, **always put bullet points on
their own line.** The bullet marker is `•` (a single character). The
renderer (`collapseSoftBreaks` in `ExplanationSlideView.tsx`) collapses
ordinary mid-paragraph `\n` to spaces but preserves any `\n` that is
immediately followed by `•` — so authoring like this just works:

```
"We use two keywords:\n• `let` — when the value MAY change.\n• `const` — when the value will not."
```

Don't run bullets inline with prose. Don't use `-`, `*`, or `–` as
bullet markers — only `•` is preserved.

## Chip puzzle ordering

`JsChipPuzzle` defaults to **strict left-to-right matching**: the placed
chips must equal `solution` slot-for-slot. Two opt-in mechanisms relax
this when the lesson semantics call for it:

- **`alternatives: string[][]`** — for partial symmetry. Each entry is a
  full alternative ordering of the same length as `solution`. Use when
  some slots are interchangeable but others (operators, separators) are
  position-locked. Example: L1 chips final puzzle accepts both
  `["let","=","const","="]` and `["const","=","let","="]` because the
  two declarations are semantically swappable, but `=` must stay in its
  operator slots.
- **`unordered: true`** — for full symmetry. The placed chips just have
  to match `solution` as a multiset; slot order is ignored entirely.
  Use only when ALL slots are interchangeable. Don't use on mixed-role
  puzzles — it would accept invalid orderings (e.g. `=` in a keyword
  slot).

If you reach for `unordered: true` and the puzzle has slots with
different semantic roles (keyword + operator, declaration + value),
that's the signal to use `alternatives` instead.

## Topic-level long-form: walkthroughs and challenges

Two ways to extend a topic with longer integrating content. Both reuse
existing schemas — they're not new tiers, just longer authored content
attached to the topic instead of a lesson.

### Walkthrough — long-form workshop (`Topic.walkthroughs[]`)

A `JsWorkshopSlide` attached at the topic level. Same schema as
lesson-level workshops (`runWorkshopChecks`, `requirePattern` + `assert`,
cumulative `reveal` chain). What changes is the audience and length:

- **Length**: 20+ meaningful steps. No filler — every step must teach or
  apply something distinct. Reps allowed only when reinforcement has
  pedagogical value (a parallel calculation that mirrors a learned
  shape, etc.).
- **Scenario**: one cohesive build that integrates concepts from across
  the topic's lessons. Students who finish all 4 lessons should see
  every concept resurface in the walkthrough.
- **Feedback**: console output via `console.log`. No UI, no DOM, no
  iframe — walkthroughs run through the same in-page workshop runner
  as lesson workshops.
- **Title**: prefix with `"Walkthrough: "` so `LessonTierMenu`'s
  prefix-strip stays consistent.

### Challenge — long-form exercise (`Topic.challenges[]`)

An `ExerciseSlide` attached at the topic level. Same single-shot,
freeform shape as lesson-level Labs. What changes:

- **Length**: 10+ user stories per challenge (entries in `tests`).
  Each user story is the student's "instructional step" — they read
  one, write code that satisfies it, see the box tick.
- **Scenario**: integrating, applied. Real enough to feel like a build
  but small enough to fit in one editor (50–80 lines of student code is
  typical).
- **Title**: prefix with `"Challenge: "`.
- **Harness**: requires a known-good entry in
  `app/scripts/test-labs.ts`'s `SOLUTIONS` array, same as lesson Labs.
  The `lessonId` for challenges follows a `topic-id` + `-` +
  `descriptive-slug` pattern (e.g. `variables-budget-tracker`); the
  harness resolves it by walking `topic.challenges[]` if no lesson
  matches.

### Test harness

Walkthroughs are validated by the existing workshop iteration —
the harness now walks both `lesson.slides` (filtered to
`kind: "js-workshop"`) AND every `topic.walkthroughs[]`. No new
machinery beyond what workshops already use.

Challenges follow the same SOLUTIONS pattern as lesson Labs.

## Tier prefix in slide titles

Workshop slide titles are authored with a leading `"Workshop: "` prefix;
exercise titles use `"Lab: "`. Topic-level long-form versions use
`"Walkthrough: "` and `"Challenge: "` respectively. The tier menu strips
these prefixes when rendering rows (`stripTierPrefix` in
[LessonTierMenu.tsx](app/src/components/LessonTierMenu.tsx)) so the card
header isn't doubly redundant. **Keep the prefix on the slide title** —
the renderer relies on it being there. New tier prefixes must be added
to the strip regex.

# Slide UI Conventions

Required reading before adding a new `slide.kind` view, modifying the
slide chrome, or restyling the breadcrumb / title row. The slide chrome
(breadcrumb, title row, font-size + theme toggle, chapter jump dots) is
built from shared components — every slide view must follow the same
pattern so navigation looks consistent across tiers.

## Layout rules

- **Breadcrumb path**: built in [App.tsx](app/src/App.tsx) for every
  view (`Home › Topic? › Lesson › Tier?`) and forwarded down. Each
  slide view receives a `breadcrumb?: BreadcrumbSegment[]` prop and
  renders it via [`SlideTitleRow`](app/src/components/SlideDeck.tsx).
- **Title row layout**: wrap H1/H2 + controls inside `<SlideTitleRow>`.
  The H2 sits left with `flex-1 min-w-0` so it shrinks instead of
  pushing controls onto a second row, then `<SlideFontSizeControl />`,
  then (explanation only) `<TypewriterToggleInline />`, then
  `<ThemeToggleInline />`, then (workshop only, when `step.hint` is
  set) the **Hint** button — in that order, on the same flex row.
- **Values pill** (workshop + exercise only): rendered immediately
  below the title row via `<ValuesPill anyValues={...} />`. On
  workshops it lives next to the per-step counter ("Step 2 / 4 ·
  ANY VALUES"); on exercises it sits between the title row and the
  prompt. Always visible — the pill is the student-facing signal of
  whether the values shown are mandatory or examples. Replaces the
  prior `FlexibilityHelpButton` "?" affordance.
- **Click propagation**: `SlideTitleRow` stops click propagation so
  controls inside it (font size, theme, typewriter, breadcrumb,
  flexibility help) never bubble up to a slide-level click handler.
  This matters because [`ExplanationSlideView`](app/src/components/ExplanationSlideView.tsx)
  wraps its whole pane in `onClick={advance}` — without the guard,
  clicking the theme toggle would also advance the slide. Don't add a
  competing `onClick` to children of the title row.
- **Description + chapter dots row**: place the description paragraph
  and the `slideJumpDots` prop side-by-side in a
  `flex items-end justify-between gap-4` row. The description grows,
  dots stay right-aligned.
- **Slide-jump dots placement**: SlideDeck pulls the dots OUT of the
  title row for the workshop and exercise tiers and renders them in a
  centered row above both panes, prefixed with a tier label
  (`Workshop X / N` or `Lab X / N`). The dots in those tiers swap the
  whole workshop/lab — they would read as a per-step indicator if left
  inline. Other slide kinds (explanation, chip puzzle, typed
  assignment, etc.) keep their dots in the right-pane title row, so
  each slide view still receives `slideJumpDots` as a prop. SlideDeck
  passes `null` for that prop on workshop/exercise so the inline slot
  collapses.
- **No outer SlideDeck chrome**: aside from the workshop/exercise
  picker row above, SlideDeck still does NOT render a global header or
  footer. The breadcrumb lives inside each slide view's title block.
- **Centering / width**: explanation and chip-puzzle slides cap at
  `max-w-7xl mx-auto`. Workshop and exercise containers use
  `max-w-[min(1700px,92vw)] mx-auto` instead — at larger font sizes
  the editor and console want horizontal room to keep code lines from
  wrapping mid-statement. Inside the prose pane each `<p>` is capped at
  `max-w-[68ch]` so paragraph text never sprawls past ~60–80 chars
  even when the pane itself is much wider.

## Reusable building blocks

- [`Breadcrumb`, `SlideTitleRow`, `BreadcrumbSegment`](app/src/components/SlideDeck.tsx)
- [`SlideFontSizeControl`, `useSlideFontSize`](app/src/components/SlideFontSize.tsx)
- [`ThemeToggleInline`](app/src/components/ThemeToggle.tsx) — use the
  inline variant in slide views; the floating `ThemeToggle` is for
  home / topic / tier-menu views only.
- [`TypewriterToggleInline`, `useTypewriter`](app/src/components/TypewriterToggle.tsx)
  — explanation slides only. The hook exposes `enabled` from a
  process-wide pub/sub (every consumer re-renders when any one toggles)
  backed by localStorage `cul:typewriter`; default honours
  `prefers-reduced-motion`.
- [`ValuesPill`](app/src/components/ValuesPill.tsx) — workshop step
  + exercise pill; renders **EXACT VALUES** by default and **ANY
  VALUES** when `anyValues: true` is set on the step / slide.
  Replaced the prior `FlexibilityHelpButton`.
- **Hint button** — inline button in the workshop title row, gated by
  `step.hint` (workshops only). Toggles a soft amber band underneath
  the instruction that prints the literal answer / formula. Local to
  the step (resets on step change) — no module yet, the button + state
  live inside [`JsWorkshopSlideView`](app/src/components/JsWorkshopSlideView.tsx).

## Responsive

Breakpoints follow Tailwind defaults: `sm` (640px), `md` (768px),
`lg` (1024px). Two-column slide layouts (code | instructions) switch to
single-column with a tab toggle at `< md` via
[`TwoColumnLayout`](app/src/components/TwoColumnLayout.tsx).

## Topic view: Walkthroughs and Challenges

The topic view (lessons grid in the centre) gains two optional sections
below the grid when authored on the topic:

- **Walkthroughs** (`Topic.walkthroughs[]`) — one card per walkthrough.
  Title, "GUIDED" pill in the topic accent, and a 5-/10-column
  milestone grid (`<WalkthroughStepGrid>` in [App.tsx](app/src/App.tsx))
  where each cell is a square button with topic-accent treatment:
  done = filled accent, current = outlined accent, upcoming = neutral
  border. Picking any cell jumps the student into the walkthrough at
  that step.
- **Challenges** (`Topic.challenges[]`) — single-tap card per challenge
  with a rose "OPEN-ENDED" pill (semantic, not topic-tied), a row of
  tick marks sized to `tests.length`, and the "0 / N passing" caption.
  No step grid (challenges are single-shot).

Sections only render when their array has at least one entry — empty
arrays / undefined fields produce no headers.

## Step counter

[`WindowedStepCounter`](app/src/components/WindowedStepCounter.tsx) is
the shared step counter for any multi-step deck (lesson workshops,
topic walkthroughs). It auto-windows: flat dots when `total ≤ 10`,
windowed (`current ± 3` plus first/last with ellipses) when
`total > 10`. Edge-aware: ellipses suppress when only a single step
would be hidden (the boundary number is shown directly instead).
`isDone > isCurrent` precedence so completed cells stay filled even
when the student is parked on them.

Visual style matches the topic-view milestone grid: each cell is a
small square that takes its colour from the active topic accent
(`useAccent()`) — done = filled accent (chapter colour), current =
outlined accent, upcoming = neutral border. Lesson workshops inherit
the topic accent of their parent topic; explanation slides inherit
the topic too via the `<AccentProvider>` set in `App.tsx`.

</script>
<script>
const NAV = [{"id":"docs","label":"Documentation","type":"group","items":[{"id":"doc-claude","type":"doc","title":"CLAUDE.md","src":"doc-claude"},{"id":"doc-authoring","type":"doc","title":"AUTHORING.md","src":"doc-authoring"},{"id":"doc-codebase","type":"doc","title":"CODEBASE_MAP.md","src":"doc-codebase"},{"id":"doc-slideui","type":"doc","title":"SLIDE_UI.md","src":"doc-slideui"}]}];
const LD = {};
</script>
<script>

const $ = id => document.getElementById(id);
const pi = s => (window.marked && marked.parseInline) ? marked.parseInline(s) : s;

const noteKey = id => 'fr:' + id;
const getNote = id => localStorage.getItem(noteKey(id)) || '';
const saveNote = (id, txt) => localStorage.setItem(noteKey(id), txt);
const delNote = id => localStorage.removeItem(noteKey(id));

function hasAnyNote(itemId) {
  const prefix = 'fr:' + itemId;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k === prefix) {
      if (localStorage.getItem(k)) return true;
    } else if (k.indexOf(prefix + ':') === 0) {
      if (localStorage.getItem(k)) return true;
    }
  }
  return false;
}

function allIds() {
  const ids = new Set();
  function walk(items) {
    for (const it of items) {
      if (it.type === 'topic') walk(it.items);
      else ids.add(it.id);
    }
  }
  for (const g of NAV) walk(g.items);
  return ids;
}

function noteCountForThisFile() {
  const ids = allIds();
  let n = 0;
  ids.forEach(id => { if (hasAnyNote(id)) n++; });
  return n;
}

const TAB_KEY = 'cul:reviewtab';
const getSavedTab = () => localStorage.getItem(TAB_KEY) || 'workshops';
const setSavedTab = (t) => localStorage.setItem(TAB_KEY, t);

let current = null;

function buildNav() {
  const root = $('nav-root');
  root.innerHTML = NAV.map(buildGroup).join('');
  root.addEventListener('click', onNavClick);
}

function buildGroup(g) {
  const body = g.items.map(it => it.type === 'topic' ? buildTopic(it) : buildItem(it)).join('');
  return '<div class="ng" data-gid="' + g.id + '"><button class="ng-btn"><span class="arr">\u25BE</span>' + g.label + '</button><div class="ng-body">' + body + '</div></div>';
}

function buildTopic(t) {
  const body = t.items.map(buildItem).join('');
  return '<div class="nt" data-tid="' + t.id + '"><div class="nt-lbl"><span class="arr">\u25BE</span>' + t.label + '</div><div class="nt-body">' + body + '</div></div>';
}

function buildItem(it) {
  const vbadge = it.variant === 'walkthrough' ? '<span class="vbadge vbadge-w">W</span>'
               : it.variant === 'challenge'   ? '<span class="vbadge vbadge-c">C</span>'
               : '';
  const hasNote = getNote(it.id) ? 'has-note' : '';
  return '<div class="ni ' + hasNote + '" data-iid="' + it.id + '">' + vbadge + it.title + '<span class="fdot"></span></div>';
}

function onNavClick(e) {
  const gb = e.target.closest('.ng-btn');
  if (gb) { gb.closest('.ng').classList.toggle('closed'); return; }
  const tl = e.target.closest('.nt-lbl');
  if (tl) { tl.closest('.nt').classList.toggle('closed'); return; }
  const item = e.target.closest('.ni');
  if (item) loadById(item.dataset.iid);
}

function setActive(id) {
  document.querySelectorAll('.ni').forEach(el => el.classList.toggle('active', el.dataset.iid === id));
}

function refreshDots() {
  document.querySelectorAll('.ni').forEach(el => {
    el.classList.toggle('has-note', hasAnyNote(el.dataset.iid));
  });
  $('note-count').textContent = noteCountForThisFile();
}

function findItem(id) {
  for (const g of NAV) {
    for (const it of g.items) {
      if (it.type === 'topic') {
        for (const li of it.items) if (li.id === id) return li;
      } else if (it.id === id) return it;
    }
  }
  return null;
}

function loadById(id) {
  const item = findItem(id);
  if (!item) return;
  current = id;
  setActive(id);
  const ci = $('ci');
  ci.innerHTML = item.type === 'doc' ? renderDoc(item) : renderLesson(item);
  ci.classList.remove('fadein');
  void ci.offsetWidth;
  ci.classList.add('fadein');
  $('content').scrollTop = 0;
  if (item.type === 'doc') {
    attachFeedback(id);
  } else {
    initLessonTabs(item.id);
    attachCardFeedback();
  }
}

function renderDoc(item) {
  const raw = ($(item.src) && $(item.src).textContent) || '';
  const html = marked.parse(raw);
  return '<div class="c-hdr"><div class="c-ey">Documentation</div><div class="c-title">' + item.title + '</div></div><div class="md">' + html + '</div>' + feedbackSection(item.id);
}

function renderLesson(item) {
  const d = LD[item.file];
  if (!d) return '<p>Data not found for ' + item.file + '.</p>';

  let topicLabel = 'JavaScript';
  for (const g of NAV) {
    for (const it of g.items) {
      if (it.type === 'topic') {
        for (const li of it.items) {
          if (li.id === item.id) { topicLabel = g.label + ' · ' + it.label; break; }
        }
      }
    }
  }

  const bMap = {
    'explanation':'b-expl','js-workshop':'b-wksh','exercise':'b-exer',
    'js-chip-assignment':'b-chip','js-typed-assignment':'b-type',
    'assignment':'b-assign','js-assignment':'b-assign'
  };
  const bLabel = {
    'explanation':'Explanation \u00D7' + d.explanationCount,
    'js-workshop':'Workshop \u00D7' + d.workshops.length,
    'exercise':'Exercise \u00D7' + d.exercises.length,
    'js-chip-assignment':'Chip puzzle',
    'js-typed-assignment':'Typed assignment',
    'assignment':'Assignment \u00D7' + d.exercises.length,
    'js-assignment':'JS Assignment'
  };

  const badges = d.slideTypes.map(t => '<span class="badge ' + (bMap[t] || 'b-expl') + '">' + (bLabel[t] || t) + '</span>').join('');

  const scenes = d.customScenes && d.customScenes.length
    ? '<div class="scenes">' + d.customScenes.map(s => '<span class="scene-tag">' + s + '</span>').join('') + '</div>'
    : '';

  const exLabel = d.slideTypes.indexOf('assignment') !== -1 ? 'Assignments' : 'Exercises';

  const tabs = '<div class="tabs" id="lesson-tabs">'
    + '<button class="tab" data-tab="workshops">Workshops <span class="count">' + d.workshops.length + '</span></button>'
    + '<button class="tab" data-tab="exercises">' + exLabel + ' <span class="count">' + d.exercises.length + '</span></button>'
    + '</div>';

  const wkPanel = d.workshops.length
    ? '<div class="cards-grid">' + d.workshops.map((w, i) => renderWorkshop(w, item.id, i)).join('') + '</div>'
    : '<div class="empty-tab">No workshops in this lesson.</div>';

  const exPanel = d.exercises.length
    ? '<div class="cards-grid">' + d.exercises.map((e, i) => renderExercise(e, item.id, i)).join('') + '</div>'
    : '<div class="empty-tab">No ' + exLabel.toLowerCase() + ' in this lesson.</div>';

  const panels = '<div class="tab-panel" data-panel="workshops">' + wkPanel + '</div>'
    + '<div class="tab-panel" data-panel="exercises">' + exPanel + '</div>';

  return '<div class="c-hdr"><div class="c-ey">' + topicLabel + '</div><div class="c-title">' + d.title + '</div><div class="badges">' + badges + '</div></div>' + scenes + tabs + panels;
}

function renderDesignNote(text) {
  return text ? '<div class="design-note dn-inline">' + text + '</div>' : '';
}

function valuesPill(anyValues) {
  return anyValues
    ? '<span class="values-pill any">ANY VALUES</span>'
    : '<span class="values-pill exact">EXACT VALUES</span>';
}

function renderWorkshop(w, lessonId, idx) {
  const cardId = lessonId + ':wk:' + idx;
  const steps = w.steps.map((s, i) =>
    '<div class="step-blk">'
    + '<div class="step-num-row"><div class="step-num">Step ' + (i + 1) + '</div>' + valuesPill(s.anyValues) + '</div>'
    + '<div class="step-instr">' + pi(s.i) + '</div>'
    + '<ul class="checks">' + s.c.map(c => '<li class="chk">' + pi(c) + '</li>').join('') + '</ul>'
    + '</div>'
  ).join('');
  return '<div class="wk-block">'
    + '<div class="wk-title">' + w.title + '</div>'
    + (w.designNote ? '<div class="dn-wrap">' + renderDesignNote(w.designNote) + '</div>' : '')
    + steps
    + cardFeedback(cardId, 'workshop')
    + '</div>';
}

function renderExercise(e, lessonId, idx) {
  const cardId = lessonId + ':ex:' + idx;
  const tests = e.tests.map(t => '<li class="test-lbl">' + pi(t) + '</li>').join('');
  return '<div class="ex-block">'
    + '<div class="ex-title">' + e.title + valuesPill(e.anyValues) + '</div>'
    + (e.designNote ? '<div class="dn-wrap">' + renderDesignNote(e.designNote) + '</div>' : '')
    + '<div class="ex-body"><div class="ex-prompt">' + pi(e.prompt) + '</div><ul class="tests">' + tests + '</ul></div>'
    + cardFeedback(cardId, 'exercise')
    + '</div>';
}

function cardFeedback(cardId, kind) {
  const saved = getNote(cardId);
  const placeholder = 'Notes for this ' + kind + '\u2026';
  return '<div class="card-fb">'
    + '<textarea class="card-fb-ta" data-card-id="' + cardId + '" placeholder="' + placeholder + '">' + saved.replace(/</g, '&lt;') + '</textarea>'
    + '<div class="card-fb-bar">'
    +   '<button class="card-fb-clr" data-clear-id="' + cardId + '" title="Clear this note" aria-label="Clear this note">\u00D7</button>'
    +   '<span class="card-fb-st' + (saved ? ' ok' : '') + '" data-status-for="' + cardId + '">' + (saved ? 'Saved' : '') + '</span>'
    + '</div>'
    + '</div>';
}

function initLessonTabs(lessonId) {
  const tabsRoot = $('lesson-tabs');
  if (!tabsRoot) return;

  const wkCount = document.querySelectorAll('[data-panel="workshops"] .wk-block').length;
  const exCount = document.querySelectorAll('[data-panel="exercises"] .ex-block').length;

  let initial = getSavedTab();
  if (initial === 'workshops' && wkCount === 0 && exCount > 0) initial = 'exercises';
  if (initial === 'exercises' && exCount === 0 && wkCount > 0) initial = 'workshops';

  activateTab(initial);

  tabsRoot.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activateTab(btn.dataset.tab);
    setSavedTab(btn.dataset.tab);
  });
}

function activateTab(name) {
  document.querySelectorAll('#lesson-tabs .tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.panel === name);
  });
}

function attachCardFeedback() {
  document.querySelectorAll('.card-fb-ta').forEach(ta => {
    let timer = null;
    ta.addEventListener('input', () => {
      const cardId = ta.dataset.cardId;
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      if (st) { st.textContent = 'Typing\u2026'; st.className = 'card-fb-st'; }
      clearTimeout(timer);
      timer = setTimeout(() => {
        const val = ta.value.trim();
        if (val) saveNote(cardId, val);
        else delNote(cardId);
        if (st) { st.textContent = '\u2713 Saved'; st.className = 'card-fb-st ok'; }
        refreshDots();
      }, 600);
    });
    ta.addEventListener('blur', () => {
      if (!timer) return;
      clearTimeout(timer);
      timer = null;
      const cardId = ta.dataset.cardId;
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      const val = ta.value.trim();
      if (val) saveNote(cardId, val);
      else delNote(cardId);
      if (st) { st.textContent = '\u2713 Saved'; st.className = 'card-fb-st ok'; }
      refreshDots();
    });
  });

  document.querySelectorAll('.card-fb-clr').forEach(btn => {
    btn.addEventListener('click', () => {
      const cardId = btn.dataset.clearId;
      const ta = document.querySelector('.card-fb-ta[data-card-id="' + cardId + '"]');
      const st = document.querySelector('[data-status-for="' + cardId + '"]');
      if (ta) ta.value = '';
      delNote(cardId);
      if (st) {
        st.textContent = 'Cleared';
        st.className = 'card-fb-st';
        setTimeout(() => { if (st.textContent === 'Cleared') st.textContent = ''; }, 1500);
      }
      refreshDots();
    });
  });
}

function clearAllNotes() {
  const count = noteCountForThisFile();
  if (count === 0) { alert('No notes to clear.'); return; }
  const msg = 'Clear ALL notes (' + count + ' item' + (count === 1 ? '' : 's') + ')?\n\nThis cannot be undone.';
  if (!confirm(msg)) return;

  const toDelete = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf('fr:') === 0) toDelete.push(k);
  }
  toDelete.forEach(k => localStorage.removeItem(k));

  document.querySelectorAll('.card-fb-ta').forEach(ta => { ta.value = ''; });
  document.querySelectorAll('.fb-ta').forEach(ta => { ta.value = ''; });
  document.querySelectorAll('.card-fb-st').forEach(s => { s.textContent = ''; s.className = 'card-fb-st'; });
  document.querySelectorAll('.save-st').forEach(s => { s.textContent = ''; s.className = 'save-st'; });
  refreshDots();
}

function feedbackSection(id) {
  const saved = getNote(id);
  return '<div class="fb-section"><div class="fb-label">Notes</div><textarea class="fb-ta" id="fb-ta" placeholder="Add your feedback, concerns, ideas, or TODOs for this item\u2026">' + saved.replace(/</g, '&lt;') + '</textarea><div class="fb-footer"><button class="btn-save" onclick="doSave()">Save Note</button><button class="btn-clr" onclick="doClear()">Clear</button><span class="save-st" id="save-st">' + (saved ? 'Saved' : '') + '</span></div></div>';
}

function attachFeedback(id) {
  const ta = $('fb-ta');
  if (!ta) return;
  ta.addEventListener('input', () => {
    const st = $('save-st');
    if (st) { st.textContent = 'Unsaved changes'; st.className = 'save-st'; }
  });
}

function doSave() {
  const ta = $('fb-ta'); if (!ta) return;
  saveNote(current, ta.value.trim());
  const st = $('save-st');
  if (st) { st.textContent = '\u2713 Saved'; st.className = 'save-st ok'; }
  refreshDots();
}

function doClear() {
  const ta = $('fb-ta'); if (!ta) return;
  if (ta.value && !confirm('Clear this note?')) return;
  ta.value = '';
  delNote(current);
  const st = $('save-st');
  if (st) { st.textContent = 'Cleared'; st.className = 'save-st'; }
  refreshDots();
}

function exportNotes() {
  const lines = [];
  const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ');
  lines.push('# Course Review Notes  (exported ' + stamp + ')');
  lines.push('');

  let anyNote = false;

  function walkLessonItem(item, crumb) {
    const data = LD[item.file];
    if (!data) return;

    const sections = [];

    const legacy = getNote(item.id);
    if (legacy) sections.push({ heading: 'General', body: legacy });

    data.workshops.forEach((w, i) => {
      const n = getNote(item.id + ':wk:' + i);
      if (n) sections.push({ heading: 'Workshop — ' + w.title, body: n });
    });

    data.exercises.forEach((e, i) => {
      const n = getNote(item.id + ':ex:' + i);
      if (n) sections.push({ heading: 'Exercise — ' + e.title, body: n });
    });

    if (sections.length === 0) return;
    anyNote = true;

    lines.push('## ' + crumb + ' · ' + data.title);
    lines.push('_id: ' + item.id + '_');
    lines.push('');
    for (const sec of sections) {
      lines.push('### ' + sec.heading);
      lines.push(sec.body);
      lines.push('');
    }
  }

  function walkDocItem(item, crumb) {
    const n = getNote(item.id);
    if (!n) return;
    anyNote = true;
    lines.push('## ' + crumb + ' · ' + (item.title || item.file));
    lines.push('_id: ' + item.id + '_');
    lines.push('');
    lines.push(n);
    lines.push('');
  }

  for (const group of NAV) {
    for (const it of group.items) {
      if (it.type === 'topic') {
        for (const li of it.items) {
          const crumb = group.label + ' · ' + it.label;
          if (li.type === 'doc') walkDocItem(li, crumb);
          else walkLessonItem(li, crumb);
        }
      } else if (it.type === 'doc') {
        walkDocItem(it, group.label);
      } else {
        walkLessonItem(it, group.label);
      }
    }
  }

  if (!anyNote) {
    lines.push('_(No notes saved yet.)_');
  }

  const text = lines.join('\n');
  const btn = $('export-btn');

  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  };

  const flash = (ok) => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = ok ? '\u2713 Copied' : 'Copy failed';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 1400);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash(true), () => { fallback(); flash(true); });
  } else {
    fallback();
    flash(true);
  }
}

marked.setOptions({ breaks: true, gfm: true });
buildNav();
refreshDots();

</script>
